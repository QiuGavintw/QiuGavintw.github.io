    /* 全螢幕切換淡入動畫 */
    if (this.fsFade > 0) {
      const a = Math.min(0.55, this.fsFade * 1.2);
      ctx.fillStyle = 'rgba(4,20,34,' + a.toFixed(3) + ')';
      ctx.fillRect(0, 0, CFG.W, CFG.H);
    }

    /* 浮動文字 */
    for (const f of this.floats) {
      ctx.font = 'bold 16px ' + FONT;
      ctx.textAlign = 'center';
      ctx.fillStyle = f.color || '#fff';
      ctx.globalAlpha = Math.max(0, 1 - f.life / 1.2);
      ctx.fillText(f.text, f.x, f.y);
      ctx.globalAlpha = 1;
    }

    /* 通知 */
    for (const t of this.toasts) {
      const a = t.life < 0.2 ? t.life * 5 : (t.life > t.dur - 0.5 ? (t.dur - t.life) * 2 : 1);
      ctx.globalAlpha = Math.max(0, Math.min(1, a));
      const w = ctx.measureText(t.text).width;
      ctx.fillStyle = 'rgba(10,30,50,0.85)';
      roundRect(CFG.W / 2 - w / 2 - 16, 84, w + 32, 36, 10); ctx.fill();
      ctx.strokeStyle = '#7ef0ff'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.font = 'bold 15px ' + FONT;
      ctx.fillStyle = '#eaf9ff'; ctx.textAlign = 'center';
      ctx.fillText(t.text, CFG.W / 2, 108);
      ctx.globalAlpha = 1;
    }
  }

  /* ---------- 研究船 ---------- */
  drawBoat() {
    const t = this.time;
    ctx.save();
    ctx.translate(CFG.BOAT_X, CFG.BOAT_Y);
    ctx.translate(Math.sin(t * 0.8) * 1.5, Math.sin(t * 0.6) * 0.8); // 船身輕微搖晃
    /* 收穫時的額外晃動 */
    if (this.boatShake > 0) {
      ctx.translate((Math.random() - 0.5) * 4 * this.boatShake, (Math.random() - 0.5) * 4 * this.boatShake);
    }
    /* 船身 */
    ctx.fillStyle = '#5a4632';
    ctx.beginPath();
    ctx.moveTo(-46, 16);
    ctx.quadraticCurveTo(-54, 26, -48, 38);
    ctx.lineTo(50, 38);
    ctx.quadraticCurveTo(56, 26, 46, 16);
    ctx.quadraticCurveTo(0, 4, -46, 16);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3a2f22'; ctx.lineWidth = 2; ctx.stroke();
    /* 甲板 */
    ctx.fillStyle = '#8a7355';
    ctx.fillRect(-42, 8, 84, 12);
    /* 船艙 */
    ctx.fillStyle = '#e8f4f8';
    ctx.fillRect(-16, -14, 32, 24);
    ctx.fillStyle = '#2a6f9c';
    ctx.fillRect(-12, -10, 24, 10);
    ctx.fillStyle = '#7ec8e8';
    ctx.fillRect(-9, -8, 6, 6); ctx.fillRect(3, -8, 6, 6);
    /* 屋頂 */
    ctx.fillStyle = '#c33b3b';
    ctx.fillRect(-19, -19, 38, 7);
    /* 旗杆 */
    ctx.strokeStyle = '#4a4a4a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(22, -14); ctx.lineTo(22, -40); ctx.stroke();
    ctx.fillStyle = '#1d6fa5';
    ctx.beginPath();
    ctx.moveTo(22, -40); ctx.lineTo(40, -34); ctx.lineTo(22, -28);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '8px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText('探', 27, -30);
    /* 研究船名稱 */
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px ' + FONT;
    ctx.textAlign = 'center';
    ctx.fillText('澎湖號', 2, 30);
    /* 吊臂基座 */
    ctx.fillStyle = '#6b7a2f';
    ctx.beginPath(); ctx.arc(0, 8, 7, 0, 7); ctx.fill();
    ctx.strokeStyle = '#4a5a20'; ctx.stroke();
    ctx.restore();
  }

  /* ---------- 吊臂與鉤子 ---------- */
  drawHook() {
    const h = this.hook;
    const armEndX = CFG.BOAT_X + Math.sin(h.angle) * CFG.ARM_LEN;
    const armEndY = CFG.PIVOT_Y + Math.cos(h.angle) * CFG.ARM_LEN;
    /* 鉤子震動（掙扎 / 噴墨時） */
    let vx = 0, vy = 0;
    if (h.vibT > 0 && h.vibT < 1.2) {
      vx = (Math.random() - 0.5) * 5 * Math.max(0, 1.2 - h.vibT);
      vy = (Math.random() - 0.5) * 5 * Math.max(0, 1.2 - h.vibT);
    }
    ctx.strokeStyle = '#5a6b3a'; ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(CFG.BOAT_X, CFG.PIVOT_Y); ctx.lineTo(armEndX, armEndY); ctx.stroke();
    /* 釣線 */
    ctx.strokeStyle = 'rgba(220,235,245,0.9)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(armEndX, armEndY); ctx.lineTo(h.x + vx, h.y + vy); ctx.stroke();
    /* 鉤子 */
    ctx.save();
    ctx.translate(h.x + vx, h.y + vy);
    ctx.strokeStyle = '#d8d8d8'; ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -8); ctx.lineTo(0, 3);
    ctx.quadraticCurveTo(0, 10, 5, 9);
    ctx.stroke();
    /* 誘餌發光（有誘餌升級時） */
    if (this.upgrade('bait') > 0) {
      const bl = 6 + Math.sin(this.time * 4) * 2;
      glow('#ffd76e', 10 + this.upgrade('bait') * 4);
      ctx.fillStyle = 'rgba(255,215,110,0.8)';
      ctx.beginPath(); ctx.arc(0, 10, bl, 0, 7); ctx.fill();
      noGlow();
    }
    ctx.restore();
  }

  /* ---------- HUD ---------- */
drawHUD() {
    /* Header 統一排版：標題 + StatsRow（padding/margin/gap 全部在此計算）
       先量高畫深色底，再畫文字，避免文字被背景覆蓋。 */
    const hcfg = {
      padTop: 14, padLeft: 16, padRight: 28,
      titleSize: 20, statSize: 17, margin: 10, gap: 26
    };
    const barH = Header.heightFor(hcfg) + 10;
    ctx.fillStyle = 'rgba(6,22,38,0.78)';
    ctx.fillRect(0, 0, CFG.W, barH);
    ctx.strokeStyle = 'rgba(126,240,255,0.4)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, barH); ctx.lineTo(CFG.W, barH); ctx.stroke();

    const hd = new Header(0, 0, CFG.W, hcfg);
    hd.title('澎湖頭足研究中心');
    const L = this.level;
    const ms = SPECIES.find(s => s.id === L.mission.sid);
    const missionCount = Math.min(this.levelCatch[L.mission.sid] || 0, L.mission.n);
    const encyCount = Object.keys(this.encyclopedia).length;
    hd.row([
      { text: '研究點', bold: true, size: 17, color: '#7ef0ff', gap: 0 },
      { text: this.testPointsText(), bold: true, size: 20, color: '#ffffff', gap: 34 },
      { text: '保育點', bold: true, size: 17, color: '#b5f2c0', gap: 0 },
      { text: this.conserve.toLocaleString(), bold: true, size: 20, color: '#ffffff', gap: 34 },
      { text: '目標：' + ms.name + ' ×' + missionCount + '/' + L.mission.n, bold: true, size: 15, color: '#ffe08a', gap: 30 },
      { text: '⏱ ' + fmtTime(this.timeLeft), bold: true, size: 16, color: '#ff9d6e', gap: 30 },
      { text: '📍 ' + L.name, bold: true, size: 16, color: '#b5f2c0', gap: 30 },
      { text: '☀ ' + WEATHER_NAMES[this.weather] + ' ' + TIDE_NAMES[this.tide], size: 14, color: '#d8e8f5', gap: 30 },
      { text: '圖鑑 ' + encyCount + '/' + SPECIES.length, size: 14, color: '#e6c7ff' }
    ]);

    /* 測試模式：右上角徽章（Header 系統），正式模式不顯示 */
    if (this.test && this.test.active) {
      const badgeH = barH;
      const bw2 = 120, bx2 = CFG.W - bw2 - 10, by2 = Math.round((badgeH - 22) / 2);
      ctx.save();
      roundRect(bx2, by2, bw2, 22, 11); ctx.fillStyle = '#6a4fa0'; ctx.fill();
      ctx.strokeStyle = '#9b6fd6'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🧪 測試模式', bx2 + bw2 / 2, by2 + 11);
      ctx.restore();
    }

    /* 底部提示 */
    if (this.hook.state === 'idle') {
      const fh = new UIFlow(0, CFG.H - 24, CFG.W, { pad: 0 });
      fh.text('吊臂自動擺動　·　點擊 / 空白鍵 放下捕撈器', { size: 15, color: 'rgba(255,255,255,0.75)', align: 'center', maxW: CFG.W, lh: 20 });
    }
  }

  /* 右下角控制按鈕（圖鑑/商店） */
  drawControls() {
    this.buttons = [];
    this.addBtn('圖鑑', 700, 68, 78, 34, () => this.openEncyclopedia(), '#6a4fa0');
    this.addBtn('商店', 782, 68, 74, 34, () => this.openShop(), '#1d6fa5');
    this.addBtn('☰ 選單', 864, 68, 82, 34, () => this.openPauseMenu(), '#3a5a8a');
    this.drawButtons();
  }

  /* ---------- 按鈕繪製（所有畫面共用，含互動狀態） ---------- */
  drawButtons() {
    for (const b of this.buttons) {
      b.updateHover(this.mouse.x, this.mouse.y, this.mouse.down);
      b.render();
    }
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }

  /* ---------- 面板框架（Layout 系統） ---------- */
  panelFrame(x, y, w, h, title) {
    const fl = UIPanel.open(x, y, w, h, title);
    return fl;
  }

  /* ---------- 圖鑑 ---------- */
  openEncyclopedia() {
    this.prevState = (this.state === 'play') ? 'play' : 'menu';
    this.encyPage = 0;   /* 物種擴充後分頁：每次開啟回到第一頁 */
    this.state = 'encyclopedia';
    this.buttons = [];
    Sfx.click();
  }
  drawEncyclopedia() {
    /* 半透明覆蓋讓文字清晰 */
    ctx.fillStyle = 'rgba(4,20,34,0.5)'; ctx.fillRect(0, 0, CFG.W, CFG.H);
    const fl = this.panelFrame(30, 40, CFG.W - 60, 540, '澎湖頭足圖鑑');
    /* 測試模式：全部物種視為已解鎖；正式模式依實際捕獲進度 */
    const testActive = this.test && this.test.active;
    const collected = testActive ? SPECIES.length : Object.keys(this.encyclopedia).length;
    const n = collected;

    /* Header Layout：標題（panelFrame 徽章）→ Subtitle → Progress，Padding/Gap 統一 */
    fl.gap(UI.gap);                    /* 標題徽章底緣與副標題間距 */
    fl.text((testActive ? '🧪 測試模式　' : '') + '已收集：' + n + ' / ' + SPECIES.length + ' 種', { size: 16, bold: true, color: '#e6c7ff', maxW: fl.w, lh: lineH(16) });
    fl.gap(UI.gap);

    /* Progress（以內容流座標自動排列，與 Header 固定間距） */
    const barW = 220, barH = 18;
    const barY = fl.cursor;
    ctx.fillStyle = '#12324a'; roundRect(fl.x, barY, barW, barH, 9); ctx.fill();
    ctx.fillStyle = '#9b6fd6'; roundRect(fl.x, barY, barW * n / SPECIES.length, barH, 9); ctx.fill();
    fl.gap(barH + UI.gap * 2);

    /* Grid：分頁（3 欄 × 2 列 = 6 張／頁），物種擴充後自動分頁，不超出 Panel */
    const gap = UI.gap + 4;
    const gw = Math.floor((fl.w - gap * 2) / 3), gh = 190;
    const PER_PAGE = 6;
    const totalPages = Math.max(1, Math.ceil(SPECIES.length / PER_PAGE));
    if (this.encyPage > totalPages - 1) this.encyPage = totalPages - 1;
    if (this.encyPage < 0) this.encyPage = 0;
    const pageSpecies = SPECIES.slice(this.encyPage * PER_PAGE, this.encyPage * PER_PAGE + PER_PAGE);
    const gy0 = fl.cursor;
    pageSpecies.forEach((sp, i) => {
      const col = i % 3, row = Math.floor(i / 3);
      const x = fl.x + col * (gw + gap), y = gy0 + row * (gh + gap);
      /* 測試模式解鎖全部；正式模式只解鎖真正捕獲過的物種 */
      const unlocked = testActive || !!this.encyclopedia[sp.id];
      const card = new UICard({
        bg: unlocked ? 'rgba(10,45,70,0.95)' : 'rgba(10,25,40,0.9)',
        border: unlocked ? '#3aa7c8' : '#2a4a5a',
        pad: 12, iconSize: 0, iconGap: 0
      });
      card.open(x, y, gw, gh, {});

      /* Icon / Image 區（共用座標，僅依解鎖切換內容） */
      ctx.save();
      ctx.translate(x + gw / 2, y + 46);
      if (unlocked) {
        /* 真實素材優先；尚未載入時回退程序繪製（不影響功能） */
        if (!this.drawPhoto(sp.id, 0, 0, gw - 24, 92)) {
          const c = new Ceph(sp, this, { preview: true });
          c.draw(this.time * 0.001);
        }
      } else {
        ctx.font = 'bold 36px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillText('？', 0, 0);
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      }
      ctx.restore();

      /* Body 內容流（共用座標，依解鎖切換內容，不建立第二套座標） */
      const cf = new UIFlow(x, y + 66, gw, { pad: 12, gap: 2 });
      if (unlocked) {
        cf.text(sp.name, { size: 17, bold: true, color: '#fff', align: 'center', maxW: gw - 24, lh: 24 });
        if (sp.formal) cf.text('正式名稱：' + sp.formal, { size: 12, color: '#a8d8ea', align: 'center', maxW: gw - 24, lh: 16 });
        cf.text(sp.latin, { size: 13, color: '#a8d8ea', align: 'center', maxW: gw - 24, lh: 18 });
        cf.text('棲地：' + sp.habitat, { size: 13, color: '#cfe9ff', maxW: gw - 24, lh: 16 });
        cf.text('時間：' + sp.time + '　季節：' + sp.season, { size: 13, color: '#cfe9ff', maxW: gw - 24, lh: 16 });
        cf.text('已捕獲：' + (testActive ? '∞' : (this.encyclopedia[sp.id] || 0)) + ' 隻', { size: 13, color: '#ffe08a', maxW: gw - 24, lh: 16 });
      } else {
        cf.text('尚未發現', { size: 17, bold: true, color: 'rgba(255,255,255,0.55)', align: 'center', maxW: gw - 24, lh: 24 });
        cf.text('捕獲後解鎖生態資料', { size: 13, color: 'rgba(255,255,255,0.4)', align: 'center', maxW: gw - 24, lh: 16 });
      }
      card.close();
    });
    this.buttons = [];
    /* 底部工具列：返回｜分頁（◀ 第 x/y 頁 ▶），全部同一列，不與 Grid 重疊 */
    if (totalPages > 1) {
      this.addBtn('◀', CFG.W - 356, CFG.H - 60, 60, 36, () => { this.encyPage = Math.max(0, this.encyPage - 1); Sfx.click(); });
      this.addBtn('第 ' + (this.encyPage + 1) + ' / ' + totalPages + ' 頁', CFG.W - 288, CFG.H - 60, 96, 36, () => {}, '#3a5a8a');
      this.addBtn('▶', CFG.W - 184, CFG.H - 60, 60, 36, () => { this.encyPage = Math.min(totalPages - 1, this.encyPage + 1); Sfx.click(); });
    }
    this.addBtn('返回', CFG.W - 130, CFG.H - 60, 100, 40, () => { this.state = this.prevState || 'menu'; Sfx.click(); });
    this.drawButtons();
  }

  /* 測試模式有效研究點：最大安全值（僅測試期間生效，不污染正式存檔） */
  testPoints() {
    return (this.test && this.test.active) ? Number.MAX_SAFE_INTEGER : this.points;
  }
  /* 測試模式有效研究點顯示文字 */
  testPointsText() {
    return this.test && this.test.active ? '∞' : this.points.toLocaleString();
  }

  /* ---------- 商店 ---------- */
  openShop() {
    this.prevState = (this.state === 'play' || this.state === 'brief' || this.state === 'clear') ? this.state : 'menu';
    this.state = 'shop';
    this.buttons = [];
    Sfx.click();
  }
  drawShop() {
    ctx.fillStyle = 'rgba(4,20,34,0.5)'; ctx.fillRect(0, 0, CFG.W, CFG.H);
    const fl = this.panelFrame(30, 30, CFG.W - 60, 560, '澎湖海洋研究中心');
    fl.row([
      { text: '研究點：' + this.testPointsText(), size: 16, bold: true, color: '#7ef0ff', gap: UI.gap * 2 },
      { text: '保育點：' + this.conserve, size: 16, bold: true, color: '#b5f2c0' }
    ]);

    /* 六項升級卡 */
    const cx = 60, cy = 96, cw = 420, ch = 138, cgap = 12;
    const ICONS = { reel: '⟳', sonar: '◎', light: '☀', bait: '⚲', gear: '⚙', ink: '◉' };
    this.buttons = [];
    SHOP.forEach((item, i) => {
      const col = i % 2, row = Math.floor(i / 2);
      const x = cx + col * (cw + cgap), y = cy + row * (ch + cgap);
      const lvl = this.upgrade(item.id);
      const price = this.shopPrice(item);
      const testActive = this.test && this.test.active;
      const canBuy = (testActive || this.points >= price) && lvl < item.max;
      const label = lvl >= item.max ? '✓ 已購買' : (canBuy ? (lvl > 0 ? '升級' : '購買') : '研究點不足');
      const state = lvl >= item.max ? 'purchased' : (canBuy ? (lvl > 0 ? 'upgrade' : 'normal') : 'disabled');
      const color = canBuy ? '#2a8f4a' : (lvl >= item.max ? '#556a5a' : '#7a5a2a');
      const hov = this.hitRect(x, y, cw, ch);
      const s = hov ? 1.03 : 1;
      const cx0 = x + cw / 2, cy0 = y + ch / 2;
      const badge = lvl === 0 ? ['未購買', '#5a6a7a'] : (lvl >= item.max ? ['已滿級', '#c8962e'] : ['已購買', '#2a8f4a']);
      const gt = this.buyGlow[item.id] || 0;

      /* 卡片：Header（圖示/名稱/狀態）＋ Body（用途/效果/持續/價格）＋ Footer（購買鈕） */
      const card = new UICard();
      card.open(x, y, cw, ch, { scale: s, hover: hov });
      card.header(ICONS[item.icon] || '✎', '#1d6fa5', item.name, lvl > 0 ? 'Lv.' + lvl : '', badge[0], badge[1], gt > 0 ? gt * 16 : 0);
      card.row('用途', item.use, y + 50);
      const ey = y + 70 + card.desc(item.desc, y + 70);
      card.row('持續', item.dur, ey + 8);
      card.row('價格', price, ey + 8, { x: 130, valueX: 40, bold: true, size: 14, valueColor: canBuy ? '#7ef0ff' : '#8a8a8a' });
      card.close();

      /* Footer：購買按鈕（狀態與文字由 UIButton 處理） */
      const bx = x + cw - 132, by = y + ch - 36, bw = 112, bh = 30;
      this.shopIconPos[item.id] = { x: card.icx, y: card.icy };
      this.addBtn(label, cx0 + (bx - cx0) * s, cy0 + (by - cy0) * s, bw * s, bh * s, () => {
        this.pulses.push({ x: bx + bw / 2, y: by + bh / 2, t: 0, max: 0.55 });
        this.buyItem(item.id);
      }, color, state);
    });

    /* 點擊縮放動畫（擴散圓環） */
    for (const p of this.pulses) {
      const k = p.t / p.max;
      ctx.strokeStyle = 'rgba(126,240,255,' + (0.9 * (1 - k)).toFixed(2) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, 8 + k * 34, 0, 7); ctx.stroke();
    }

    this.addBtn('返回', CFG.W - 130, CFG.H - 58, 100, 40, () => this.closeShop());
    this.drawButtons();
  }
  buyItem(id) {
    const item = SHOP.find(s => s.id === id);
    if (!item) return;
    const lvl = this.upgrade(id);
    const price = this.shopPrice(item);
    /* 測試模式：一律允許購買且不扣點（不採計 infinitePoints 勾選框） */
    const testFree = this.test && this.test.active;
    if (lvl >= item.max) { this.toast(item.name + ' 已達最高等級'); Sfx.deny(); return; }
    if (!testFree && this.points < price) { this.toast('研究點不足，請先完成研究任務'); Sfx.deny(); return; }
    if (!testFree) this.points -= price;
    this.upgrades[id] = lvl + 1;
    Sfx.buy();
    /* 購買回饋：圖示火花、發光、研究點扣除浮字、成功提示 */
    const pos = this.shopIconPos[id];
    if (pos) {
      Particles.sparkle(pos.x, pos.y, '#7ef0ff');
      Particles.sparkle(pos.x, pos.y, '#ffe08a');
      this.floats.push({ x: pos.x, y: pos.y - 26, text: '研究成功!', color: '#b3ffab', life: 0 });
    }
    this.buyGlow[id] = 1.5;
    if (!testFree) this.floats.push({ x: 150, y: 78, text: '-' + price + ' 研究點', color: '#7ef0ff', life: 0 });
    this.toast(item.name + ' 升級至 Lv.' + this.upgrade(id));
    saveState(this);
  }
  closeShop() {
    this.state = this.prevState || 'menu';
    Sfx.click();
  }

  /* ---------- 資訊小卡 ---------- */
  drawCard() {
    if (!this.cardData) { this.state = 'play'; return; }
    const { ceph, firstTime, pts } = this.cardData;
    const sp = ceph.spec;
    const fl = this.panelFrame(140, 80, CFG.W - 280, 470, '研究紀錄');
    /* 左側：生物圖示（真實素材優先，回退程序繪製） */
    ctx.save();
    ctx.translate(230, 200);
    if (!this.drawPhoto(sp.id, 0, 0, 170, 170)) {
      const drawC = new Ceph(sp, this, { sizeMul: 1.6, preview: true });
      drawC.swimT = this.time;
      drawC.draw(this.time * 0.001);
    }
    ctx.restore();
    /* 右側：統一內容流（固定欄寬 / 行高 / 段落間距，禁止自行算座標） */
    const rx = 330, rw = 470;
    const rf = new UIFlow(rx, fl.y, rw, { pad: 0 });

    /* 標題區：中文名稱 / 學名 / 澎湖俗名 */
    rf.text(sp.name, { size: 22, bold: true, color: '#fff', maxW: rw, lh: 28 });

    this.addBtn(lb, CFG.W / 2 - 90, CFG.H - 70, 180, 42, () => { this.cardData = null; this.state = 'play'; Sfx.click(); }, '#2a8f4a');

    fl.text(ceph.isRare ? '你捕獲了一隻稀有的' + sp.name + '！' : '你捕獲了一隻年幼的' + sp.name + '（幼體）！', { size: 24, bold: true, color: ceph.isRare ? '#ffe08a' : '#ffd54d', align: 'center', maxW: fl.w, lh: 34 });

    ctx.translate(CFG.W / 2, 250);

  /* ---------- 輸入處理 ---------- */
  onMouseMove(x, y) { this.mouse.x = x; this.mouse.y = y; }
  onMouseDown(x, y) {
    this.mouse.x = x; this.mouse.y = y; this.mouse.down = true;
    Sfx.init(); Sfx.resume();
  }
  onMouseUp(x, y) {
    this.mouse.x = x; this.mouse.y = y;
    /* 處理按鈕點擊（disabled / purchased 不可點擊） */
    for (const b of this.buttons) {
      if (this.hitButton(b)) {
        this.mouse.down = false;
        if (!b.clickable) return;
        Sfx.click(); b.fn(); return;
      }
    }
    /* 非按鈕區域 */
    if (this.state === 'play') {
      this.dropHook();
    } else if (this.state === 'menu') {
      this.startLevel(this.levelIndex);
    }
    this.mouse.down = false;
  }
  onKey(space) {
    Sfx.init(); Sfx.resume();
    if (space) {
      if (this.state === 'play') this.dropHook();
      else if (this.state === 'menu') { this.startLevel(this.levelIndex); Sfx.click(); }
      else if (this.state === 'brief') { this.state = 'play'; Sfx.click(); }
      else if (this.state === 'card' && this.cardData) { this.cardData = null; this.state = 'play'; }
      else if (this.state === 'choice' && this.pendingCatch) { this.chooseDefault(); }
      else if (this.state === 'paused') { this.resumeGame(); }
    }
  }
  chooseDefault() {
    /* 預設：帶回研究（教育引導） */
    const { ceph, pts, firstTime } = this.pendingCatch;
    this.addPoints(pts);
    this.pendingCatch = null;
    this.showCard(ceph, firstTime, pts);
  }

  /* ============================================================
     [GameState.PAUSED] 暫停 / ☰ 遊戲中選單
     ============================================================ */
  /* 進入暫停：狀態機 → PAUSED；記憶原狀態以便繼續 */
  openPauseMenu() {
    if (this.state === GameState.PAUSED) return;
    this._resumeState = this.state;      // play / brief / clear…
    this.state = GameState.PAUSED;
    this.buttons = [];
    Sfx.click();
  }
  resumeGame() {
    const target = this._resumeState || GameState.PLAYING;
    this.state = (target === GameState.PAUSED) ? GameState.PLAYING : target;
    this._resumeState = null;
    this.buttons = [];
    Sfx.click();
  }
  /* 回首頁（含確認） */
  requestHome() {
    this.buttons = [];
    this._homeConfirm = true;
    Sfx.click();
  }
  goHome() {
    this._homeConfirm = false;
    this._resumeState = null;
    this.exitTestMode(false);            // 若在測試模式，放棄測試結果
    this.state = GameState.HOME;
    this.buttons = [];
    Sfx.click();
  }
  drawPauseMenu() {
    /* 背景仍顯示（凍結） */
    const fl = this.panelFrame(300, 150, CFG.W - 600, 310, '遊戲選單');
    fl.text(this._homeConfirm ? '' : '遊戲已暫停', { size: 20, bold: true, color: '#fff', align: 'center', maxW: fl.w, lh: 28 });
    if (this._homeConfirm) {
      fl.text('確定要離開目前遊戲嗎？', { size: 18, bold: true, color: '#fff', align: 'center', maxW: fl.w, lh: 26 });
      fl.text('本關目前進度將不會保留。', { size: 14, color: '#ff9d6e', align: 'center', maxW: fl.w, lh: 20 });
      fl.gap(6);
      this.buttons = [];
      this.addBtn('取消', CFG.W / 2 - 180, fl.cursor + 8, 160, 46, () => { this._homeConfirm = false; Sfx.click(); }, '#3a5a8a');
      this.addBtn('回首頁', CFG.W / 2 + 20, fl.cursor + 8, 160, 46, () => this.goHome(), '#c2352a');
      this.drawButtons();
      return;
    }
    fl.gap(4);
    this.buttons = [];
    const bw = 260, bh = 44, y0 = fl.cursor + 10, bgap = 52;
    this.addBtn('▶ 繼續遊戲', CFG.W / 2 - bw / 2, y0, bw, bh, () => this.resumeGame(), '#2a8f4a');
    this.addBtn('⏸ 暫停遊戲（已暫停）', CFG.W / 2 - bw / 2, y0 + bgap, bw, bh, () => { this.toast('遊戲已暫停', 1.5); Sfx.click(); }, '#3a5a8a');
    this.addBtn('🏠 回首頁', CFG.W / 2 - bw / 2, y0 + bgap * 2, bw, bh, () => this.requestHome(), '#c2352a');
    this.addBtn('⚙ 設定', CFG.W / 2 - bw / 2, y0 + bgap * 3, bw, bh, () => this.openSettingsFromPause(), '#1d6fa5');
    this.drawButtons();
  }
  /* 從暫停進入設定：仍保持暫停，離開設定回到 PAUSED（不自動繼續） */
  openSettingsFromPause() {
    this.state = GameState.SETTINGS;
    this._returnToPaused = true;
    this.buttons = [];
    Sfx.click();
  }

  /* ============================================================
     [GameState.TEST_MODE] 測試模式
     ============================================================ */
  openTestMode() {
    /* 快照正式資料（進入測試時） */
    this.test.snapshot = {
      points: this.points, conserve: this.conserve,
      encyclopedia: Object.assign({}, this.encyclopedia),
      upgrades: Object.assign({}, this.upgrades),
      badges: this.badges.slice(),
      totalCatch: this.totalCatch,
      levelIndex: this.levelIndex
    };
    /* 測試模式的「有效」研究點：最大安全值（runtime override，不寫入存檔） */
    this.test.researchPoints = Number.MAX_SAFE_INTEGER;
    this.test.active = true;
    this.state = GameState.TEST_MODE;
    this.buttons = [];
    Sfx.click();
  }
  /* 離開測試模式：save=true 才保留測試結果到正式資料 */
  exitTestMode(save) {
    if (!this.test.active) return;
    if (save && this.test.snapshot) {
      /* 保留目前數值，正式存檔 */
    } else if (this.test.snapshot) {
      /* 還原正式資料 */
      this.points = this.test.snapshot.points;
      this.conserve = this.test.snapshot.conserve;
      this.encyclopedia = this.test.snapshot.encyclopedia;
      this.upgrades = this.test.snapshot.upgrades;
      this.badges = this.test.snapshot.badges;
      this.totalCatch = this.test.snapshot.totalCatch;
      this.levelIndex = this.test.snapshot.levelIndex;
      saveState(this);
    }
    this.test.snapshot = null;
    this.test.active = false;
    this.test.debug = false;
    this.cardData = null;
    this.pendingCatch = null;
    this.toasts = [];
    this.floats = [];
  }
  /* 依測試設定組合出一個關卡（LEVELS 模板 + 覆寫） */
  buildTestLevel() {
    const cfg = this.test.cfg;
    const base = LEVELS[cfg.levelIndex] || LEVELS[0];
    return Object.assign({}, base, {
      loc: base.loc,
      tod: cfg.timeOfDay,
      season: cfg.season,
      time: cfg.infiniteTime ? 9999 : base.time,
      timeLimit: cfg.infiniteTime ? 9999 : base.time,
      mission: Object.assign({}, base.mission, { sid: SPECIES[cfg.speciesIdx].id })
    });
  }
  /* 開始測試：進入遊玩（無限時間/無限點數由旗標控制） */
  startTest() {
    this.level = this.buildTestLevel();
    this.levelIndex = this.test.cfg.levelIndex;
    this.timeLeft = this.level.time;
    this.weather = pick(this.level.weather || ['sunny']);
    this.tide = pick(['high', 'mid', 'low']);
    this.levelCatch = {};
    this.creatures = [];
    this.rocks = [];
    this.hook = { x: CFG.BOAT_X, y: 0, angle: 0, dir: 1, state: 'idle', line: CFG.ARM_LEN, target: null, liftFail: 0, t: 0, vibT: 0, fxDone: false };
    this.inkTimer = 0;
    this.catchCount = 0;
    this.missionDone = false;
    this.spawnTimer = 0;
    this.toasts = [];
    this.floats = [];
    Decor.gen(this.level.loc, this.levelIndex * 7919 + 13);
    this.rocks = Decor.list.filter(d => d.type === 'rock');
    if (!this.rocks.length) this.rocks = [{ x: CFG.W * 0.3, y: CFG.FLOOR_Y - 20 }, { x: CFG.W * 0.7, y: CFG.FLOOR_Y - 16 }];
    /* 測試模式立即生成指定物種 */
    for (let i = 0; i < 5; i++) this.spawnCeph();
    this.state = GameState.PLAYING;
    this.buttons = [];
    Sfx.startWaves();
    Sfx.boatHum();
  }
  /* 立即生成：只產生指定物種 */
  instantSpawn() {
    if (this.state !== GameState.PLAYING || !this.test.active) return;
    for (let i = 0; i < 3; i++) this.spawnCeph();
    this.toast('已生成指定頭足類 ×3', 2);
    Sfx.click();
  }
  /* 測試模式捕獲：直接將鉤子鉤住第一隻目標 */
  testGrab() {
    const c = this.creatures[0];
    if (!c) { this.toast('目前沒有生物', 2); return; }
    if (this.hook.state !== 'idle') { this.toast('鉤子忙碌中', 2); return; }
    this.hook.x = c.x; this.hook.y = c.y;
    c.attached = true; c.state = 'caught'; c.caughtT = 0;
    c.caughtLine = this.hook.line;
    this.hook.state = 'caught'; this.hook.target = c; this.hook.liftFail = 0; this.hook.t = 0; this.hook.fxDone = false;
    Sfx.catchPop();
  }
  /* 測試模式強制成功捕獲：直接進入資訊卡 */
  testForceCatch() {
    const c = this.creatures[0];
    if (!c) { this.toast('目前沒有生物', 2); return; }
    this.hook.target = null;
    this.hook.state = 'idle';
    this.catchSuccess(c);
    this.toast('已模擬捕獲成功', 2);
  }
  /* 測試模式：模擬逃脫（掙扎 → 脫鉤 → 游入海中） */
  testEscape() {
    const c = this.hook.target || this.creatures[0];
    if (!c) { this.toast('目前沒有生物', 2); return; }
    c.attached = true;
    c.state = 'struggle';
    c.struggleT = 0.01;
    c.escapeTries = 2;
    this.hook.state = 'struggle';
    this.hook.target = c;
    this.toast('已觸發：拖行→掙脫→游入海中', 2.5);
  }
  /* 測試模式 Debug Panel */
  drawDebugPanel() {
    const L = this.level;
    const first = this.creatures[0];
    const sp = first ? first.spec : null;
    const cfg = this.test.cfg;
    const lines = [
      ['Game State', this.state],
      ['Current Level', (L.levelName || L.name) + ' (#' + this.levelIndex + ')'],
      ['Current Species', sp ? sp.name : '—'],
      ['Species State', first ? first.state : '—'],
      ['Entity Position', first ? Math.round(first.x) + ',' + Math.round(first.y) : '—'],
      ['Entity Velocity', first ? Math.round(first.escapeVX || 0) + ',' + Math.round(first.escapeVY || 0) : '—'],
      ['Hook State', this.hook.state],
      ['Capture State', this.hook.target ? 'attached' : '—'],
      ['Escape State', first && first.state === 'escape' ? 'escaping' : '—'],
      ['Current Time', TOD_NAMES[L.tod] + (cfg.infiniteTime ? '（無限）' : ' ' + fmtTime(this.timeLeft))],
      ['Current Season', SEASON_NAMES[L.season]],
      ['Current Depth', cfg.depth],
      ['Spawn Probability', (cfg.probability * 100) + '%']
    ];
    ctx.fillStyle = 'rgba(6,22,38,0.85)';
    ctx.fillRect(560, 92, 388, 18 + lines.length * 18);
    ctx.strokeStyle = '#7ef0ff'; ctx.lineWidth = 1; ctx.strokeRect(560, 92, 388, 18 + lines.length * 18);
    let y = 104;
    ctx.font = '12px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    for (const [k, v] of lines) {
      ctx.fillStyle = '#7ef0ff'; ctx.fillText(k + '：', 570, y);
      ctx.fillStyle = '#eaf9ff'; ctx.fillText(String(v), 700, y);
      y += 18;
    }
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
  /* 測試模式畫面（設定面板） */
  drawTestMode() {
    ctx.fillStyle = 'rgba(4,20,34,0.6)'; ctx.fillRect(0, 0, CFG.W, CFG.H);
    const cfg = this.test.cfg;
    const fl = this.panelFrame(200, 40, CFG.W - 400, 540, '測試模式');
    fl.text('自由調整參數，體驗捕捉流程；離開時可選擇還原或保留。', { size: 14, color: '#a8d8ea', align: 'center', maxW: fl.w, lh: 20 });
    fl.gap(6);
    const sp = SPECIES[cfg.speciesIdx];
    const lv = LEVELS[cfg.levelIndex];
    const rows = [
      ['關卡', 'Lv.' + (cfg.levelIndex + 1) + ' ' + (lv.levelName || lv.name), 'levelIndex', LEVELS.length],
      ['物種', sp.name + '（' + sp.latin + '）', 'speciesIdx', SPECIES.length],
      ['時間', TOD_NAMES[cfg.timeOfDay], 'timeOfDay', ['day', 'night', 'dusk', 'dawn']],
      ['季節', SEASON_NAMES[cfg.season], 'season', ['spring', 'summer', 'autumn', 'winter']],
      ['深度', cfg.depth === 'near' ? '近海' : (cfg.depth === 'mid' ? '中層' : '深海'), 'depth', ['near', 'mid', 'deep']],
      ['出現機率', Math.round(cfg.probability * 100) + '%', 'probability', [0.25, 0.5, 0.75, 1.0]]
    ];
    /* 每列：標籤 + 目前值 + [▼] 切換按鈕 */
    this.buttons = [];
    let y = fl.cursor + 4;
    for (const [label, val, key, opts] of rows) {
      fl.text(label + '：' + val, { size: 16, color: '#eaf9ff', align: 'center', maxW: fl.w, lh: 22 });
      this.addBtn('▼', CFG.W / 2 + 150, y, 46, 30, (() => { const k = key, o = opts; return () => {
        if (k === 'probability') { const idx = o.indexOf(cfg.probability); cfg.probability = o[(idx + 1) % o.length]; }
        else if (Array.isArray(o)) { const idx = o.indexOf(cfg[k]); cfg[k] = o[(idx + 1) % o.length]; }
        else cfg[k] = (cfg[k] + 1) % o;
        Sfx.click();
      }; })(), '#1d6fa5');
      y += 30;
    }
    fl.gap(6);
    /* 勾選：無限時間 / 無限研究點 / 無限保育點 */
    const toggles = [
      ['無限時間', 'infiniteTime'],
      ['無限研究點', 'infinitePoints'],
      ['無限保育點', 'infiniteConserve']
    ];
    for (const [label, key] of toggles) {
      const on = cfg[key];
      this.addBtn((on ? '☑ ' : '☐ ') + label, CFG.W / 2 - 130, y, 260, 38, () => { cfg[key] = !cfg[key]; Sfx.click(); }, on ? '#2a8f4a' : '#44505a');
      y += 46;
    }
    /* 動作按鈕 */
    this.addBtn('立即生成', CFG.W / 2 - 280, CFG.H - 96, 170, 46, () => { this.startTest(); this.instantSpawn(); }, '#1d6fa5');
    this.addBtn('開始測試', CFG.W / 2 - 85, CFG.H - 96, 170, 46, () => this.startTest(), '#2a8f4a');
    this.addBtn('返回設定', CFG.W / 2 + 110, CFG.H - 96, 170, 46, () => { this.state = GameState.SETTINGS; this.test.active = false; Sfx.click(); }, '#3a5a8a');
    this.drawButtons();
  }
  /* 測試模式：HUD 下方測試工具列 */
  drawTestTools() {
    if (!this.test.active || this.state !== GameState.PLAYING) return;
    const y = CFG.H - 46;
    this.addBtn('🖥 除錯', 8, y, 82, 32, () => { this.test.debug = !this.test.debug; Sfx.click(); }, '#6a4fa0');
    this.addBtn('⚡ 生成', 96, y, 82, 32, () => this.instantSpawn(), '#1d6fa5');
    this.addBtn('🎣 抓取', 184, y, 82, 32, () => this.testGrab(), '#1d6fa5');
    this.addBtn('✓ 成功捕獲', 272, y, 100, 32, () => this.testForceCatch(), '#2a8f4a');
    this.addBtn('✗ 模擬逃脫', 378, y, 100, 32, () => this.testEscape(), '#c2352a');
    this.drawButtons();
  }
}

/* 在 Game 上掛載：以真實照片繪製（cover-fit，保持比例、裁切填滿）
   回傳 true = 已繪製照片；false = 尚未載入，由呼叫端回退程序繪製。 */
Game.prototype.drawPhoto = function (sid, cx, cy, boxW, boxH) {
  const img = IMAGES[sid];
  if (!img || !img._ok || !(img.naturalWidth || img.naturalHeight)) return false;
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  if (!iw || !ih) return false;
  const s = Math.max(boxW / iw, boxH / ih);
  const dw = iw * s, dh = ih * s;
  ctx.save();
  ctx.beginPath();
  ctx.rect(cx - boxW / 2, cy - boxH / 2, boxW, boxH);
  ctx.clip();
  ctx.drawImage(img, cx - dw / 2, cy - dh / 2, dw, dh);
  ctx.restore();
  return true;
};

/* 十六進位色調深淺調整 */
function shadeHex(hex, f) {
  const n = parseInt(hex.replace('#', ''), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(r * f); g = Math.round(g * f); b = Math.round(b * f);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ============================================================
   [模組 12] 初始化與主迴圈
   ============================================================ */
(function boot() {
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');

  /* 設定邏輯解析度 960x600，依裝置像素比縮放 */
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = CFG.W * DPR;
  canvas.height = CFG.H * DPR;
  ctx.scale(DPR, DPR);

  const game = new Game();
  window.__game = game;

  loadCephImages();   /* 載入圖鑑 / 資訊小卡用的真實素材影像 */

  /* 畫面縮放：依視窗尺寸調整 */
  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const scale = Math.min(vw / (CFG.W + 40), vh / (CFG.H + 20), 1.4);
    canvas.style.width = Math.round(CFG.W * scale) + 'px';
    canvas.style.height = Math.round(CFG.H * scale) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  /* 滑鼠與觸控 */
  function toLogical(ev) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (ev.clientX - rect.left) * CFG.W / rect.width,
      y: (ev.clientY - rect.top) * CFG.H / rect.height
    };
  }
  canvas.addEventListener('mousemove', ev => game.onMouseMove(toLogical(ev).x, toLogical(ev).y));
  canvas.addEventListener('mousedown', ev => game.onMouseDown(toLogical(ev).x, toLogical(ev).y));
  canvas.addEventListener('mouseup', ev => game.onMouseUp(toLogical(ev).x, toLogical(ev).y));
  canvas.addEventListener('touchstart', ev => { ev.preventDefault(); const t = toLogical(ev.touches[0]); game.onMouseDown(t.x, t.y); }, { passive: false });
  canvas.addEventListener('touchmove', ev => { ev.preventDefault(); const t = toLogical(ev.touches[0]); game.onMouseMove(t.x, t.y); }, { passive: false });
  canvas.addEventListener('touchend', ev => { ev.preventDefault(); game.onMouseUp(game.mouse.x, game.mouse.y); }, { passive: false });
  canvas.addEventListener('touchcancel', ev => { game.mouse.down = false; }, { passive: false });
  document.addEventListener('keydown', ev => {
    if (ev.code === 'Space') { ev.preventDefault(); game.onKey(true); }
  });

  /* 背景音樂與海浪於首次互動後啟動 */
  document.addEventListener('pointerdown', function once() {
    Sfx.startWaves();
    Sfx.startMusic();
    /* 若上次偏好全螢幕，於首次互動時自動進入 */
    if (game.fsPref && isFsSupported() && !isFullscreen()) {
      requestFullscreen();
      game.fsFade = 0.5;
    }
    document.removeEventListener('pointerdown', once);
  });

  /* 全螢幕狀態同步（Esc 離開時同步偏好與淡出） */
  document.addEventListener('fullscreenchange', function () {
    game.fsPref = isFullscreen();
    saveFsPref(game.fsPref);
    game.fsFade = 0.3;
  });
  document.addEventListener('webkitfullscreenchange', function () {
    game.fsPref = isFullscreen();
    saveFsPref(game.fsPref);
    game.fsFade = 0.3;
  });

  /* 主迴圈 */
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    game.update(dt);
    game.render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
