   ============================================================ */

   GAME_OVER  結束關卡（timeout）
   CLEAR      關卡完成
   END        全部完成
   HELP       研究員手冊
   ============================================================ */
const GameState = {
  HOME: 'menu',
  SETTINGS: 'settings',
  TEST_MODE: 'test',
  PLAYING: 'play',
  PAUSED: 'paused',
  MISSION: 'brief',
  INFO_CARD: 'card',
  CONSERVATION_CHOICE: 'choice',
  SHOP: 'shop',

  GAME_OVER: 'gameover',
  CLEAR: 'clear',
  END: 'end',
  HELP: 'help'
};

/* --- 隨機與數學工具 --- */
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function dist(x1, y1, x2, y2) { const dx = x2 - x1, dy = y2 - y1; return Math.sqrt(dx * dx + dy * dy); }
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = randInt(0, i); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }
function starsString(n) { let s = ''; for (let i = 0; i < 5; i++) s += (i < n) ? '★' : '☆'; return s; }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function fmtTime(sec) { sec = Math.max(0, Math.ceil(sec)); return pad(Math.floor(sec / 60)) + ':' + pad(sec % 60); }

/* --- 儲存/載入 --- */
function loadSave() {
  try {
    const raw = localStorage.getItem(CFG.SAVE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* 忽略讀取錯誤 */ }
  return null;
}
function saveState(state) {
  /* 測試模式：不得污染正式存檔（除非明確儲存測試結果） */
  if (state && state.test && state.test.active) return;
  try {
    localStorage.setItem(CFG.SAVE_KEY, JSON.stringify({
      points: state.points,
      conserve: state.conserve,
      encyclopedia: state.encyclopedia,
      upgrades: state.upgrades,
      badges: state.badges,
      totalCatch: state.totalCatch,
      levelIndex: state.levelIndex
    }));
  } catch (e) { /* 忽略寫入錯誤 */ }
}

/* --- 全螢幕偏好（localStorage 記憶） --- */
const FS_KEY = 'penghu_ceph_fs_v1';
function loadFsPref() { try { return localStorage.getItem(FS_KEY) === '1'; } catch (e) { return false; } }
function saveFsPref(v) { try { localStorage.setItem(FS_KEY, v ? '1' : '0'); } catch (e) { /* 忽略 */ } }
function isFsSupported() {
  return !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen || document.documentElement.msRequestFullscreen);
}
function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
}
function requestFullscreen() {
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (fn) { const p = fn.call(el); if (p && p.catch) p.catch(() => { /* 忽略 rejected promise */ }); }
}
function exitFullscreen() {
  const fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  if (fn) fn.call(document);
}

/* ============================================================
   [模組 2] 音效引擎（Web Audio API 合成，無外部音檔）
   ============================================================ */
const Sfx = (() => {
  let ctx = null, master = null, noiseBuf = null;
  let wavesGain = null, wavesOsc = null, wavesSrc = null;
  let musicTimer = null, reelTimer = null;
  const PENTA = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33];

  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.5;
    master.connect(ctx.destination);
    /* 建立雜訊 buffer（用於海浪、水花等） */
    const len = ctx.sampleRate * 2;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }

  /* 基本音色 */
  function tone(freq, dur, type, vol, slideTo) {
    if (!ctx) return;
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(vol || 0.2, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function noise(dur, filterFreq, vol, sweepTo) {
    if (!ctx) return;
    const t0 = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(filterFreq, t0);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t0 + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol || 0.2, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur + 0.02);
  }

  /* 海浪背景：持續低頻雜訊，音量隨正弦起伏 */
  function startWaves() {
    if (!ctx || wavesGain) return;
    wavesSrc = ctx.createBufferSource();
    wavesSrc.buffer = noiseBuf; wavesSrc.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 350;
    wavesGain = ctx.createGain(); wavesGain.gain.value = 0.0;
    wavesOsc = ctx.createOscillator(); wavesOsc.frequency.value = 0.14;
    const wg = ctx.createGain(); wg.gain.value = 0.05;
    wavesOsc.connect(wg); wg.connect(wavesGain.gain);
    wavesSrc.connect(f); f.connect(wavesGain); wavesGain.connect(master);
    wavesSrc.start(); wavesOsc.start();
    wavesGain.gain.setTargetAtTime(0.12, ctx.currentTime, 1.5);
  }
  function stopWaves() { if (wavesGain) wavesGain.gain.setTargetAtTime(0, ctx.currentTime, 0.4); }

  /* 海鳥叫聲：偶發兩聲尖銳滑音 */
  function seagull() {
    if (Math.random() > 0.25) return;
    const f = rand(900, 1400);
    tone(f, 0.25, 'triangle', 0.05, f * 1.35);
    setTimeout(() => tone(f * 1.2, 0.2, 'triangle', 0.04, f * 0.8), 350);
  }

  /* 收線：週期性喀聲 */
  function reelTick() { tone(1500 + Math.random() * 300, 0.03, 'square', 0.025); }
  function startReel() {
    if (reelTimer || !ctx) return;
    reelTick();
    reelTimer = setInterval(reelTick, 110);
  }
  function stopReel() { if (reelTimer) { clearInterval(reelTimer); reelTimer = null; } }

  /* 遊戲事件音效 */
  function drop() { tone(240, 0.18, 'triangle', 0.12, 120); }
  function splash() { noise(0.35, 900, 0.25, 200); }
  function catchPop() { tone(520, 0.12, 'sine', 0.2, 300); tone(760, 0.1, 'sine', 0.15, 500); }
  function miss() { tone(300, 0.15, 'sine', 0.12, 150); }
  function escape() { tone(700, 0.2, 'sawtooth', 0.08, 1200); }
  function inkBlast() { noise(0.5, 600, 0.3, 80); }
  function coin() { tone(880, 0.08, 'square', 0.06, 1320); }
  function buy() { tone(700, 0.09, 'square', 0.09); setTimeout(() => tone(1050, 0.14, 'square', 0.09), 90); }
  function deny() { tone(220, 0.2, 'sawtooth', 0.1, 160); }
  function click() { tone(500, 0.05, 'triangle', 0.12); }
  /* 掙扎：快速不規則短音 */
  function struggle() {
    for (let i = 0; i < 6; i++) {
      const f = rand(180, 300);
      setTimeout(() => tone(f, 0.06, 'sawtooth', 0.05, rand(140, 220)), i * 55);
    }
  }
  /* 脫鉤：清脆彈響 */
  function snap() { tone(1000, 0.05, 'square', 0.08, 320); }

  /* 研究完成：上行三連音 */
  function researchChime() {
    const ns = [523.25, 659.25, 783.99];
    ns.forEach((n, i) => setTimeout(() => tone(n, 0.18, 'triangle', 0.14), i * 120));
  }
  /* 圖鑑解鎖：清脆亮音 */
  function unlockJingle() {
    const ns = [783.99, 1046.5, 1318.5, 1568];
    ns.forEach((n, i) => setTimeout(() => tone(n, 0.22, 'sine', 0.12), i * 100));
  }
  /* 徽章：大氣四連音 */
  function fanfare() {
    const ns = [392, 523.25, 659.25, 783.99];
    ns.forEach((n, i) => setTimeout(() => tone(n, 0.3, 'triangle', 0.16), i * 150));
  }
  /* 船聲：低沉引擎哼鳴 */
  function boatHum() { tone(70, 0.8, 'sine', 0.05, 55); }

  /* 背景音樂：五聲音階琶音循環 */
  function startMusic() {
    if (musicTimer || !ctx) return;
    let step = 0;
    musicTimer = setInterval(() => {
      const note = PENTA[step % PENTA.length];
      tone(note, 0.5, 'sine', 0.045);
      if (step % 4 === 0) tone(note / 2, 0.7, 'sine', 0.04);
      step++;
    }, 420);
  }
  function stopMusic() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }

  return {
    init, resume, startWaves, stopWaves, seagull,
    reelTick, startReel, stopReel,
    drop, splash, catchPop, miss, escape, inkBlast, coin, buy, deny, click, struggle, snap,
    researchChime, unlockJingle, fanfare, boatHum,
    startMusic, stopMusic
  };
})();

/* ============================================================
   [模組 6] 繪圖工具與字型
   ============================================================ */
let canvas, ctx;
const FONT = '"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';

/* 多行文字繪製（自動換行） */
function drawText(text, x, y, size, color, align, weight, maxW, lh) {
  ctx.font = (weight ? weight + ' ' : '') + size + 'px ' + FONT;
  ctx.fillStyle = color;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  if (maxW && ctx.measureText(text).width > maxW) {
    let line = '', yy = y;
    for (const ch of text) {
      const t = line + ch;
      if (ctx.measureText(t).width > maxW && line) { ctx.fillText(line, x, yy); yy += (lh || size * 1.35); line = ch; }
      else line = t;
    }
    ctx.fillText(line, x, yy);
    return yy + (lh || size * 1.35);
  }
  ctx.fillText(text, x, y);
  return y + (lh || size * 1.35);
}

/* 圓角矩形 */
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* 柔和陰影 */
function glow(color, blur) {
  ctx.shadowColor = color;
  ctx.shadowBlur = blur || 12;
}
function noGlow() { ctx.shadowBlur = 0; }

/* ============================================================
   [模組 6c] UI Layout System
   統一排版元件：間距主題、TextBlock、流向佈局、Icon、Button、Panel、Card
   所有畫面共用同一套間距與排版規則，禁止各畫面自行計算座標。
   ============================================================ */
const UI = {
  pad: 16,         // 容器內邊距
  gap: 10,         // 元素垂直間距
  para: 8,         // 段落間距
  titleGap: 6,     // 標題與內文間距
  lh: 1.5,         // 行高倍率
  iconSize: 48,    // 圖示尺寸
  iconGap: 12,     // 圖示與文字間距
  btnH: 38,        // 標準按鈕高度
  btnPadX: 18,     // 按鈕水平內邊距
  radius: 10,      // 按鈕圓角
  panelRadius: 14, // 面板圓角
  labelCol: 44     // 標籤與值欄位間距
};

/* 以字元為單位自動換行（適合中日文） */
function wrapLines(text, maxW, size, bold) {
  ctx.font = (bold ? 'bold ' : '') + size + 'px ' + FONT;
  const out = [];
  let line = '';
  for (const ch of String(text)) {
    const t = line + ch;
    if (ctx.measureText(t).width > maxW && line) { out.push(line); line = ch; }
    else line = t;
  }
  if (line) out.push(line);
  return out;
}
function lineH(size) { return Math.round(size * UI.lh); }

/* ---------- TextBlock：自動換行 / 自動高度 / 對齊 / 基準線 / 最大寬度 ---------- */
class UIText {
  constructor(text, o) {
    o = o || {};
    this.text = String(text);
    this.size = o.size || 14;
    this.color = o.color || '#d8ecf8';
    this.bold = !!o.bold;
    this.align = o.align || 'left';          // left / center / right
    this.baseline = o.baseline || 'alphabetic';
    this.maxW = o.maxW != null ? o.maxW : 1e9;
    this.lh = o.lh || lineH(this.size);
    this.gap = o.gap != null ? o.gap : 0;    // 區塊後額外間距
  }
  get height() { return this.lines.length * this.lh + this.gap; }
  draw(x, y, w) {
    const maxW = Math.min(this.maxW, w != null ? w : this.maxW);
    this.lines = wrapLines(this.text, maxW, this.size, this.bold);
    ctx.font = (this.bold ? 'bold ' : '') + this.size + 'px ' + FONT;
    ctx.fillStyle = this.color;
    ctx.textBaseline = this.baseline;
    ctx.textAlign = this.align;
    const ax = this.align === 'center' ? x + maxW / 2 : this.align === 'right' ? x + maxW : x;
    let by = y + this.size;
    for (const ln of this.lines) { ctx.fillText(ln, ax, by); by += this.lh; }
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    return this.height;
  }
}

/* ---------- Icon：固定大小、水平置中、垂直基準線對齊 ---------- */
class UIIcon {
  constructor(symbol, o) {
    o = o || {};
    this.symbol = symbol;
    this.color = o.color || '#1d6fa5';
    this.size = o.size || UI.iconSize;
  }
  get height() { return this.size; }
  /* x,y = 置中點；於指定寬度 box 內水平置中 */
  draw(cx, cy, box) {
    const b = box != null ? box : this.size;
    ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(cx, cy, this.size / 2, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(126,240,255,0.9)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#7ef0ff';
    ctx.font = Math.round(this.size * 0.55) + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(this.symbol, cx, cy + 1);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
}

/* ---------- Button：Normal / Hover / Pressed / Disabled / Purchased / Upgrade ---------- */
class UIButton {
  constructor(label, o) {
    o = o || {};
    this.label = label;
    this.color = o.color || '#1d6fa5';
    this.fn = o.fn || null;
    this.x = o.x || 0; this.y = o.y || 0;
    this.w = o.w || 0; this.h = o.h || UI.btnH;
    this.padX = o.padX != null ? o.padX : UI.btnPadX;
    this.base = o.state || 'normal';         // normal / disabled / purchased / upgrade
    this.state = 'normal';                   // normal / hover / pressed（互動狀態）
    this._hov = false;
  }
  measure() {
    if (this.w) return this.w;
    ctx.font = 'bold 15px ' + FONT;
    this.w = Math.max(84, ctx.measureText(this.label).width + this.padX * 2);
    return this.w;
  }
  place(x, y) { this.x = x; this.y = y; this.measure(); }
  hit(mx, my) { return mx >= this.x && mx <= this.x + this.w && my >= this.y && my <= this.y + this.h; }
  get clickable() { return this.base !== 'disabled' && this.base !== 'purchased'; }
  updateHover(mx, my, down) {
    this._hov = this.hit(mx, my);
    if (!this.clickable) { this.state = 'normal'; return; }
    this.state = this._hov ? (down ? 'pressed' : 'hover') : 'normal';
  }
  render() {
    this.measure();
    let fill;
    if (this.base === 'purchased') fill = this._hov ? shadeHex('#2a8f4a', 0.85) : '#2a8f4a';
    else if (this.base === 'upgrade') fill = this._hov ? shadeHex('#b8860b', 0.85) : '#b8860b';
    else if (this.base === 'disabled') fill = '#44505a';
    else if (this.state === 'pressed') fill = shadeHex(this.color, 0.6);
    else if (this.state === 'hover') fill = shadeHex(this.color, 0.75);
    else fill = this.color;
    ctx.fillStyle = fill;
    roundRect(this.x, this.y, this.w, this.h, UI.radius); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.font = 'bold 15px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(this.label, this.x + this.w / 2, this.y + this.h / 2 + 1);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
}

/* ---------- Flow：垂直流向佈局（自動換行、自動高度、自動推進游標） ---------- */
class UIFlow {
  constructor(x, y, w, o) {
    o = o || {};
    this.pad = o.pad != null ? o.pad : UI.pad;
    this.gapSize = o.gap != null ? o.gap : UI.gap;
    this.x = x + this.pad;
    this.y = y + this.pad;
    this.w = Math.max(1, w - this.pad * 2);
    this.cursor = this.y;
  }
  get height() { return this.cursor - this.y; }
  text(text, o) {
    o = o || {};
    const maxW = o.maxW != null ? o.maxW : this.w;
    const t = new UIText(text, Object.assign({}, o, { maxW }));
    this.cursor += t.draw(this.x, this.cursor, maxW);
    return this;
  }
  title(text, o) {
    o = o || {};
    this.text(text, Object.assign({ size: 18, bold: true, color: '#ffe08a' }, o));
    this.cursor += (o.titleGap != null ? o.titleGap : UI.titleGap);
    return this;
  }
  gap(h) { this.cursor += (h == null ? this.gapSize : h); return this; }
  /* 同一行繪製多個文字（以測量寬度 + 間距自動推進 x） */
  row(items) {
    let x = this.x;
    ctx.textBaseline = 'alphabetic';
    for (const it of items) {
      ctx.font = (it.bold ? 'bold ' : '') + (it.size || 14) + 'px ' + FONT;
      ctx.fillStyle = it.color || '#fff';
      ctx.textAlign = it.align || 'left';
      ctx.fillText(it.text, it.align === 'right' ? x + it.w : x, this.cursor);
      x += ctx.measureText(it.text).width + (it.gap != null ? it.gap : this.gapSize);
    }
    ctx.textAlign = 'left';
    this.cursor += (items[0] ? items[0].size || 14 : 14) + this.gapSize;
    return this;
  }
  line() {
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
    const ly = this.cursor + this.gapSize / 2;
    ctx.beginPath(); ctx.moveTo(this.x, ly); ctx.lineTo(this.x + this.w, ly); ctx.stroke();
    this.cursor += this.gapSize;
    return this;
  }
  /* 標籤 + 值：固定標籤欄寬（對齊用），值可自動換行，基準線與 text() 一致 */
  labelValue(label, value, o) {
    o = o || {};
    const size = o.size || 14;
    const lh = o.lh || lineH(size);
    const col = o.col != null ? o.col : 100;
    const valMaxW = Math.max(40, this.w - col);
    const lines = wrapLines(String(value), valMaxW, size, !!o.bold);
    ctx.font = (o.bold ? 'bold ' : '') + size + 'px ' + FONT;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = o.labelColor || '#cfe9ff';
    ctx.fillText(String(label), this.x, this.cursor + size);
    ctx.fillStyle = o.valueColor || '#ffffff';
    for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], this.x + col, this.cursor + size + i * lh);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    this.cursor += lines.length * lh;
    return this;
  }
}

/* ---------- Panel：暗幕 + 框架 + 標題，回傳內容流 ---------- */
class UIPanel {
  /* 徽章（標題）佔用的垂直空間：比 (y-18 到 y+16) 再留 margin，防內容重疊。 */
  static BADGE_TOP = 18;
  static BADGE_BOTTOM = 16;
  static open(x, y, w, h, title) {
    ctx.fillStyle = 'rgba(4,20,34,0.93)';
    roundRect(x, y, w, h, UI.panelRadius); ctx.fill();
    ctx.strokeStyle = '#3aa7c8'; ctx.lineWidth = 2; ctx.stroke();
    let contentPad = UI.pad;
    if (title) {
      const tw = ctx.measureText(title).width + 34;
      ctx.fillStyle = '#1d6fa5';
      roundRect(x + 20, y - 18, tw, 18 + UIPanel.BADGE_BOTTOM, 17); ctx.fill();
      ctx.font = 'bold 17px ' + FONT; ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
      ctx.fillText(title, x + 37, y + 5);
      ctx.textAlign = 'left';
      /* 內容從徽章底緣（y + BADGE_BOTTOM）下方開始，保證標題與統計不重疊 */
      contentPad = UIPanel.BADGE_BOTTOM + UI.gap;
    }
    const fl = new UIFlow(x, y, w, { pad: contentPad });
    return fl;
  }
}

/* ---------- Card：Header / Body / Footer、Padding、Gap、Auto Height、Hover ---------- */
class UICard {
  constructor(o) {
    o = o || {};
    this.pad = o.pad != null ? o.pad : UI.pad;
    this.gap = o.gap != null ? o.gap : UI.gap;
    this.radius = o.radius || 12;
    this.bg = o.bg || 'rgba(10,45,70,0.95)';
    this.border = o.border || '#3aa7c8';
    this.iconSize = o.iconSize || UI.iconSize;
    this.iconGap = o.iconGap || 8;
    this.lh = o.lh || lineH(12);
  }
  /* 開啟卡片：背景 + 懸停微放大，之後所有內容都繪製於縮放座標系 */
  open(x, y, w, h, o) {
    o = o || {};
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.scale = o.scale || 1;
    this.hover = !!o.hover;
    const cx0 = x + w / 2, cy0 = y + h / 2;
    ctx.save();
    ctx.translate(cx0, cy0); ctx.scale(this.scale, this.scale); ctx.translate(-cx0, -cy0);
    ctx.fillStyle = this.bg;
    roundRect(x, y, w, h, this.radius); ctx.fill();
    return this;
  }
  /* 關閉卡片：外框（懸停發光或一般） */
  close() {
    ctx.restore();
    if (this.hover) {
      ctx.save();
      glow('#7ef0ff', 14);
      ctx.strokeStyle = '#7ef0ff'; ctx.lineWidth = 2.5;
      roundRect(this.x, this.y, this.w, this.h, this.radius); ctx.stroke();
      ctx.restore();
    } else {
      ctx.strokeStyle = this.border; ctx.lineWidth = 1.5;
      roundRect(this.x, this.y, this.w, this.h, this.radius); ctx.stroke();
    }
    return this;
  }
  get icx() { return this.x + this.pad + this.iconSize / 2; }   // 圖示中心 x
  get icy() { return this.y + this.pad + this.iconSize / 2; }   // 圖示中心 y
  get tx() { return this.x + this.pad + this.iconSize + this.iconGap; } // 文字起點 x
  get descW() { return this.w - this.tx + this.x - 148; }               // 效果描述可用寬度（避開底部按鈕）
  /* Header：圖示（置中）+ 標題（含 Lv）+ 右側狀態徽章 */
  header(iconSym, iconColor, title, lv, badge, badgeColor, glowAmt) {
    if (glowAmt) { ctx.save(); glow('#7ef0ff', glowAmt); }
    new UIIcon(iconSym, { size: this.iconSize, color: iconColor || '#1d6fa5' })
      .draw(this.icx, this.icy, this.iconSize);
    if (glowAmt) ctx.restore();
    ctx.font = 'bold 16px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#fff';
    ctx.fillText(title + (lv ? ' ' + lv : ''), this.tx, this.y + this.pad + 8);
    if (badge) {
      ctx.fillStyle = badgeColor;
      roundRect(this.x + this.w - 96, this.y + this.gap, 80, 20, 10); ctx.fill();
      ctx.font = 'bold 12px ' + FONT; ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.fillText(badge, this.x + this.w - 56, this.y + this.gap + 13);
    }
    ctx.textAlign = 'left';
    return this;
  }
  /* Body：標籤 + 值 的欄位列 */
  row(label, value, y, o) {
    o = o || {};
    const x = this.tx + (o.x || 0);
    ctx.font = (o.bold ? 'bold ' : '') + (o.size || 12) + 'px ' + FONT;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = o.labelColor || '#ffe08a';
    ctx.fillText(label, x, y);
    ctx.fillStyle = o.valueColor || '#cfe9ff';
    ctx.fillText(String(value), x + (o.valueX || UI.labelCol), y);
    ctx.textAlign = 'left';
    return this;
  }
  /* Body：可換行的效果描述，回傳消耗高度 */
  desc(text, y, o) {
    o = o || {};
    const t = new UIText(text, Object.assign({ size: 12, color: '#d8ecf8', lh: this.lh }, o, { maxW: this.descW }));
    t.draw(this.tx, y, this.descW);
    return t.height;
  }
}

/* ---------- Header 統一排版：標題 + StatsRow ----------
   以 padding / margin / gap / fontMetrics 計算位置，
   禁止各處自行決定 y 座標；文字統一使用 textBaseline='top'。
   以後新增項目（時間/關卡/任務…）只要把項目加到 items，
   就會自動排列、不重疊、不隨數字變長而碰撞。 */
class Header {
  constructor(x, y, w, o) {
    o = o || {};
    this.x = x; this.y = y; this.w = w;
    this.padTop = o.padTop != null ? o.padTop : 20;
    this.padL = o.padLeft != null ? o.padLeft : 24;
    this.padR = o.padRight != null ? o.padRight : 24;
    this.margin = o.margin != null ? o.margin : 16;      // 標題與 Stats 間距（margin-top 14~20）
    this.gap = o.gap != null ? o.gap : 24;               // Stats 內容間距
    this.titleSize = o.titleSize || 22;
    this.statSize = o.statSize || 18;
    this.titleColor = o.titleColor || '#eaf9ff';
    this.statColor = o.statColor || '#ffffff';
    this.accentColor = o.accentColor || '#7ef0ff';
    this.weakColor = o.weakColor || '#9fb8c8';
    this.iconGap = o.iconGap != null ? o.iconGap : 8;    // 統計圖示與文字間距
    this._y = this.y + this.padTop;                      // 目前繪製頂端（top-baseline）
    this._x = this.x + this.padL;
    this._w = Math.max(1, this.w - this.padL - this.padR);
    this._limitW = o.maxColW || Math.max(1, this.w - this.padL * 2);
  }
  /* 標題行（top-baseline）；回傳本身以利鏈接 */
  title(text, o) {
    o = o || {};
    ctx.font = 'bold ' + (o.size || this.titleSize) + 'px ' + FONT;
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillStyle = o.color || this.titleColor;
    ctx.fillText(text, this._x, this._y);
    this._y += this.titleSize;
    this._y += this.margin;
    return this;
  }
  /* 統計列：以量測寬度逐項前推 x；『研究點：10,000』再長也不會撞到下一項 */
  row(items, o) {
    o = o || {};
    let x = this._x;
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    for (const it of items) {
      const size = it.size || it.sz || o.size || this.statSize;
      ctx.font = (it.bold ? 'bold ' : '') + size + 'px ' + FONT;
      ctx.fillStyle = it.color || it.c || this.statColor;
      ctx.fillText(String(it.text), x, this._y);
      x += ctx.measureText(String(it.text)).width + (it.gap != null ? it.gap : this.gap);
    }
    this._y += this.statSize;
    return this;
  }
  /* 給定 Header 參數，回傳其總高度（供背景先畫） */
  static heightFor(o) {
    o = o || {};
    const padTop = o.padTop != null ? o.padTop : 20;
    const titleSize = o.titleSize || 22;
    const margin = o.margin != null ? o.margin : 16;
    const statSize = o.statSize || 18;
    const padBottom = o.padBottom != null ? o.padBottom : 14;
    return padTop + titleSize + margin + statSize + padBottom;
  }
}

/* 一列按鈕：水平置中、固定間距、自動寬度（掛到 game.buttons） */
function buttonRow(game, y, specs, o) {
  o = o || {};
  const gap = o.gap != null ? o.gap : UI.gap;
  const bs = specs.map(s => new UIButton(s.label, {
    color: s.color, fn: s.fn, state: s.state, w: s.w || 0, h: s.h || UI.btnH, padX: s.padX
  }));
  const total = bs.reduce((a, b) => a + b.measure(), 0) + gap * (bs.length - 1);
  let x = CFG.W / 2 - total / 2;
  for (const b of bs) { b.place(x, y); x += b.w + gap; game.buttons.push(b); }
  return bs;
}

/* 一欄按鈕：垂直置中、固定間距（掛到 game.buttons） */
function buttonCol(game, cx, y0, specs, o) {
  o = o || {};
  const gap = o.gap != null ? o.gap : UI.gap + 6;
  let y = y0;
  for (const s of specs) {
    const b = new UIButton(s.label, {
      color: s.color, fn: s.fn, state: s.state, w: s.w || 0, h: s.h || UI.btnH, padX: s.padX
    });
    b.measure();
    b.place(cx - b.w / 2, y);
    y += b.h + gap;
    game.buttons.push(b);
  }
  return y;
}

/* ============================================================
   [模組 7] 粒子系統（海浪 / 泡泡 / 水花 / 墨汁 / 星星）
   ============================================================ */
const Particles = {
  list: [],
  spawn(x, y, type, opts) {
    this.list.push(Object.assign({ x, y, type, life: 0, age: 0 }, opts || {}));
  },
  bubble(x, y) { this.spawn(x, y, 'bubble', { vy: rand(-55, -35), r: rand(2, 6), a: rand(0.2, 0.5) }); },
  splash(x, y) {
    for (let i = 0; i < 14; i++) {
      this.spawn(x + rand(-12, 12), y, 'drop', { vx: rand(-90, 90), vy: rand(-160, -40), r: rand(1.5, 4), a: 0.9, grav: 1 });
    }
  },
  sparkle(x, y, color) { this.spawn(x, y, 'sparkle', { r: rand(3, 8), a: 1, color: color || '#ffe08a' }); },
  ink(x, y) {
    for (let i = 0; i < 22; i++) {
      this.spawn(x + rand(-10, 10), y + rand(-10, 10), 'ink', { vx: rand(-70, 70), vy: rand(-70, 70), r: rand(8, 20), a: rand(0.5, 0.9) });
    }
  },
  catchBurst(x, y) {
    for (let i = 0; i < 12; i++) {
      this.spawn(x, y, 'sparkle', { r: rand(4, 10), a: 1, vx: rand(-60, 60), vy: rand(-90, -20), color: pick(['#7ef0ff', '#ffe08a', '#b3ffab']) });
    }
  },
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const p = this.list[i];
      p.age += dt; p.life += dt;
      const dead = p.life > (p.maxLife || 1.4);
      if (!dead) {
        if (p.vx) p.x += p.vx * dt;
        if (p.vy) p.y += p.vy * dt;
        if (p.grav) p.vy += 300 * dt;
        if (p.type === 'bubble') p.y += p.vy * dt;
      }
      if (dead || (p.type === 'bubble' && p.y < CFG.SEA_Y)) this.list.splice(i, 1);
    }
  },
  draw() {
    for (const p of this.list) {
      const t = p.life / (p.maxLife || 1.4);
      const alpha = p.a * (1 - t);
      if (p.type === 'bubble') {
        ctx.strokeStyle = 'rgba(255,255,255,' + (alpha * 0.6) + ')';
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,' + alpha * 0.15 + ')';
        ctx.fill();
      } else if (p.type === 'drop') {
        ctx.fillStyle = 'rgba(220,240,255,' + alpha + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
      } else if (p.type === 'sparkle') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.life * 3);
        ctx.fillStyle = p.color || '#ffe08a';
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        for (let k = 0; k < 4; k++) {
          const a = k * Math.PI / 2;
          ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * p.r, Math.sin(a) * p.r);
          ctx.lineTo(Math.cos(a + 0.3) * p.r * 0.3, Math.sin(a + 0.3) * p.r * 0.3);
        }
        ctx.fill(); ctx.restore(); ctx.globalAlpha = 1;
      } else if (p.type === 'ink') {
        ctx.fillStyle = 'rgba(20,15,25,' + alpha + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 - t * 0.3), 0, 7); ctx.fill();
      }
    }
  }
};

/* 泡泡環境（持續產生的海底氣泡） */
const Bubbles = {
  list: [],
  update(dt) {
    if (Math.random() < 0.25) {
      this.list.push({ x: rand(20, CFG.W - 20), y: CFG.FLOOR_Y + rand(0, 30), r: rand(1.5, 5), a: rand(0.15, 0.4) });
    }
    for (let i = this.list.length - 1; i >= 0; i--) {
      const b = this.list[i];
      b.y -= (25 + b.r * 4) * dt;
      b.x += Math.sin(b.y * 0.02) * 8 * dt;
      if (b.y < CFG.SEA_Y) this.list.splice(i, 1);
    }
  },
  draw() {
    for (const b of this.list) {
      ctx.strokeStyle = 'rgba(255,255,255,' + b.a + ')';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke();
    }
  }
};

/* ============================================================
   [模組 8] 背景：場景、天氣、潮汐繪製
   ============================================================ */
const Backdrop = {
  /* 天空與海面分層，依時間帶（day/night/dusk/dawn）改變色調 */
  skyColors(tod) {
    switch (tod) {
      case 'night': return { top: '#060d2e', bot: '#12275a', sun: 'moon', star: true };
      case 'dusk': return { top: '#3b3a6b', bot: '#e08a5a', sun: 'sunset', star: false };
      case 'dawn': return { top: '#7aa2b8', bot: '#f0c98a', sun: 'sunrise', star: false };
      default: return { top: '#4a9fd8', bot: '#aee3f2', sun: 'sun', star: false };
    }
  },
  seaColors(loc, tod) {
    const shade = (tod === 'night') ? 0.45 : (tod === 'dusk' ? 0.75 : 1);
    const base = {
      harbor: ['#0e6b86', '#1b9aa6'],
      coastal: ['#0a5c85', '#1a8fbf'],
      sandy: ['#0f7a8a', '#33b3ab'],
      reef: ['#0b5f8a', '#2aa0c8'],
      seagrass: ['#0c6a70', '#2fae8f'],
      night: ['#08183a', '#14325e'],
      intertidal: ['#0a6a80', '#3ab8a8']
    }[loc];
    return base.map(c => shadeColor(c, shade));
  },
  /* 海底底色（沙泥/礁岩/海草） */
  floorColors(loc) {
    return {
      harbor: ['#d9c9a0', '#b8a37a'],
      coastal: ['#e3d8b8', '#c4b390'],
      sandy: ['#f0e0bd', '#d2b98a'],
      reef: ['#d8b5a0', '#a97a6a'],
      seagrass: ['#a8c88a', '#7aa860'],
      night: ['#3c4a68', '#2a3450'],
      intertidal: ['#c8d0b0', '#98a878']
    }[loc];
  },
  draw(ctx, game, timeOverride) {
    const tod = game.level.tod, loc = game.level.loc;
    const sky = this.skyColors(tod);
    const sea = this.seaColors(loc, tod);
    const floor = this.floorColors(loc);
    const t = (timeOverride != null ? timeOverride : game.time) * 0.001;

    /* 天空 */
    const g = ctx.createLinearGradient(0, 0, 0, CFG.SEA_Y);
    g.addColorStop(0, sky.top); g.addColorStop(1, sky.bot);
    ctx.fillStyle = g; ctx.fillRect(0, 0, CFG.W, CFG.SEA_Y);

    /* 星星（夜晚） */
    if (sky.star) {
      for (let i = 0; i < 60; i++) {
        const sx = (i * 157.3) % CFG.W;
        const sy = (i * 89.7) % 130;
        const tw = 0.4 + 0.6 * Math.sin(t * 2 + i);
        ctx.globalAlpha = tw;
        ctx.fillStyle = '#fff';
        ctx.fillRect(sx, sy, 1.5, 1.5);
      }
      ctx.globalAlpha = 1;
    }
    /* 太陽 / 月亮 */
    const sx = CFG.W * 0.78, sy = 48;
    if (sky.sun === 'sun' || sky.sun === 'sunrise' || sky.sun === 'sunset') {
      const c = (sky.sun === 'sun') ? '#fff6c8' : '#ffca88';
      glow(c, 30); ctx.fillStyle = c; ctx.beginPath(); ctx.arc(sx, sy, 26, 0, 7); ctx.fill(); noGlow();
    } else if (sky.sun === 'moon') {
      ctx.fillStyle = '#f4f2e8'; ctx.beginPath(); ctx.arc(sx, sy, 20, 0, 7); ctx.fill();
      ctx.fillStyle = sky.top; ctx.beginPath(); ctx.arc(sx - 8, sy - 6, 17, 0, 7); ctx.fill();
    }
    /* 雲 */
    const clouds = game.weather === 'rainy' ? 4 : game.weather === 'stormy' ? 5 : 2;
    ctx.fillStyle = game.weather === 'stormy' ? 'rgba(90,95,105,0.7)' : (game.weather === 'rainy' ? 'rgba(160,175,190,0.6)' : 'rgba(255,255,255,0.55)');
    for (let i = 0; i < clouds; i++) {
      const cx = ((i * 333 + t * (8 + i * 3)) % (CFG.W + 200)) - 100;
      const cy = 30 + i * 26;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 46, 14, 0, 0, 7);
      ctx.ellipse(cx + 28, cy + 4, 34, 12, 0, 0, 7);
      ctx.fill();
    }
    /* 天氣效果：雨 / 雷電閃爍 */
    if (game.weather === 'rainy' || game.weather === 'stormy') {
      ctx.strokeStyle = 'rgba(190,215,235,0.5)'; ctx.lineWidth = 1;
      for (let i = 0; i < 40; i++) {
        const rx = (i * 97 + t * 700) % CFG.W;
        const ry = (i * 61 + t * 900) % (CFG.SEA_Y - 30);
        ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 3, ry + 12); ctx.stroke();
      }
      if (game.weather === 'stormy' && Math.sin(t * 3) > 0.97) {
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.fillRect(0, 0, CFG.W, 20);
      }
    }

    /* 海面 */
    const sg = ctx.createLinearGradient(0, CFG.SEA_Y, 0, CFG.FLOOR_Y);
    sg.addColorStop(0, sea[0]); sg.addColorStop(1, sea[1]);
    ctx.fillStyle = sg; ctx.fillRect(0, CFG.SEA_Y, CFG.W, CFG.FLOOR_Y - CFG.SEA_Y);

    /* 海底 */
    const fg = ctx.createLinearGradient(0, CFG.FLOOR_Y, 0, CFG.H);
    fg.addColorStop(0, floor[0]); fg.addColorStop(1, floor[1]);
    ctx.fillStyle = fg; ctx.fillRect(0, CFG.FLOOR_Y, CFG.W, CFG.H - CFG.FLOOR_Y);
    /* 海底紋理 */
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
    for (let i = 0; i < 26; i++) {
      const fy = CFG.FLOOR_Y + 6 + (i * 11.3 % (CFG.H - CFG.FLOOR_Y - 8));
      ctx.beginPath(); ctx.moveTo(0, fy); ctx.quadraticCurveTo(CFG.W * 0.5, fy + 5, CFG.W, fy); ctx.stroke();
    }

    /* 海面波浪（動態） */
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath(); ctx.moveTo(0, CFG.SEA_Y + 6);
    for (let x = 0; x <= CFG.W; x += 16) ctx.lineTo(x, CFG.SEA_Y + 6 + Math.sin(x * 0.03 + t * 2.2) * 3.5);
    ctx.lineTo(CFG.W, CFG.SEA_Y + 26); ctx.lineTo(0, CFG.SEA_Y + 26); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, CFG.SEA_Y + 1);
    for (let x = 0; x <= CFG.W; x += 8) ctx.lineTo(x, CFG.SEA_Y + 1 + Math.sin(x * 0.03 + t * 2.2) * 3.5);
    ctx.stroke();
  }
};

function shadeColor(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(r * f); g = Math.round(g * f); b = Math.round(b * f);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ============================================================
   [模組 9] 場景裝飾：岩石、珊瑚、海草、珊瑚礁等
   ============================================================ */
const Decor = {
  list: [],
  gen(loc, seed) {
    this.list = [];
    const rnd = mulberry(seed);
    const N = { harbor: 6, coastal: 5, sandy: 6, reef: 10, seagrass: 12, night: 5, intertidal: 8 }[loc] || 6;
    for (let i = 0; i < N; i++) {
      const x = rnd() * (CFG.W - 60) + 30;
      const y = CFG.FLOOR_Y + rnd() * (CFG.H - CFG.FLOOR_Y - 18);
      let type;
      if (loc === 'reef') type = pick(['coral', 'rock', 'seaflower']);
      else if (loc === 'seagrass') type = pick(['seagrass', 'rock', 'shell']);
      else if (loc === 'intertidal') type = pick(['rock', 'shell', 'starfish']);
      else if (loc === 'harbor') type = pick(['pile', 'rope', 'rock', 'shell']);
      else type = pick(['rock', 'shell', 'seagrass']);
      this.list.push({ type, x, y, s: 0.7 + rnd() * 0.8, phase: rnd() * 6.28, fg: rnd() < 0.3 });
    }
    this.list.sort((a, b) => (a.fg ? 1 : 0) - (b.fg ? 1 : 0));
  },
  draw(t, fgOnly) {
    for (const d of this.list) {
      if (d.fg !== fgOnly) continue;
      this.drawOne(d, t);
    }
  },
  drawOne(d, t) {
    const w = 34 * d.s;
    switch (d.type) {
      case 'rock': {
        ctx.fillStyle = '#6f5b52'; ctx.strokeStyle = '#54443d'; ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(d.x - w, d.y);
        ctx.quadraticCurveTo(d.x - w * 0.6, d.y - w * 0.8, d.x, d.y - w * 0.55);
        ctx.quadraticCurveTo(d.x + w * 0.6, d.y - w * 0.75, d.x + w, d.y);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.beginPath(); ctx.ellipse(d.x - w * 0.25, d.y - w * 0.35, w * 0.3, w * 0.15, -0.5, 0, 7); ctx.fill();
        break;
      }
      case 'coral': {
        ctx.strokeStyle = '#e8628a'; ctx.lineWidth = 3;
        for (let k = -1; k <= 1; k++) {
          ctx.beginPath(); ctx.moveTo(d.x, d.y);
          ctx.quadraticCurveTo(d.x + k * w * 0.4, d.y - w * 0.6, d.x + k * w * 0.8, d.y - w * 0.9);
          ctx.quadraticCurveTo(d.x + k * w, d.y - w * 1.2, d.x + k * w * 1.15, d.y - w * 1.35);
          ctx.stroke();
          ctx.beginPath(); ctx.moveTo(d.x + k * w * 0.6, d.y - w * 0.7);
          ctx.lineTo(d.x + k * w * 0.5, d.y - w * 1.0); ctx.stroke();
        }
        ctx.fillStyle = '#ffb3c8';
        ctx.beginPath(); ctx.arc(d.x, d.y - w * 1.4, 3.5, 0, 7); ctx.arc(d.x + w * 0.7, d.y - w * 0.9, 3, 0, 7); ctx.fill();
        break;
      }
      case 'seaflower': {
        ctx.fillStyle = '#7ed0ff';
        for (let k = -1; k <= 1; k++) {
          ctx.beginPath(); ctx.arc(d.x + k * w * 0.4, d.y - 4, 3, 0, 7); ctx.fill();
        }
        ctx.strokeStyle = '#6ab6ee'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x, d.y - 4); ctx.stroke();
        break;
      }
      case 'seagrass': {
        ctx.strokeStyle = '#4e9e58'; ctx.lineWidth = 2.5;
        for (let k = -2; k <= 2; k++) {
          const sway = Math.sin(t * 1.5 + d.phase + k) * 5;
          ctx.beginPath(); ctx.moveTo(d.x + k * 5, d.y);
          ctx.quadraticCurveTo(d.x + k * 5 + sway * 0.3, d.y - w, d.x + k * 5 + sway, d.y - w * 1.6);
          ctx.stroke();
        }
        break;
      }
      case 'shell': {
        ctx.fillStyle = 'rgba(255,240,220,0.85)'; ctx.strokeStyle = 'rgba(180,150,120,0.8)'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(d.x - w * 0.4, d.y);
        ctx.quadraticCurveTo(d.x, d.y - w * 0.6, d.x + w * 0.4, d.y);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x, d.y - w * 0.5); ctx.stroke();
        break;
      }
      case 'starfish': {
        ctx.fillStyle = '#ff9966';
        ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(0.3);
        ctx.beginPath();
        for (let k = 0; k < 10; k++) {
          const r = (k % 2 === 0) ? w * 0.5 : w * 0.2;
          const a = k * Math.PI / 5;
          if (k === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
          else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath(); ctx.fill(); ctx.restore();
        break;
      }
      case 'pile': {
        ctx.fillStyle = '#8a6b45';
        ctx.fillRect(d.x - 4, d.y - 46 * d.s, 8, 46 * d.s);
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillRect(d.x - 4, d.y - 46 * d.s, 8, 6);
        ctx.strokeStyle = '#6b5234'; ctx.lineWidth = 1.5;
        ctx.strokeRect(d.x - 4, d.y - 46 * d.s, 8, 46 * d.s);
        break;
      }
      case 'rope': {
        ctx.strokeStyle = '#a07a4a'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(d.x - 20, d.y);
        ctx.quadraticCurveTo(d.x, d.y - 8, d.x + 20, d.y);
        ctx.stroke();
        break;
      }
    }
  }
};

/* 確定性亂數（用於場景產生） */
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============================================================
   [模組 10] 頭足類生物實體與 AI 行為
   ============================================================ */
class Ceph {
  constructor(spec, game, opts) {
    this.spec = spec;
    this.game = game;
    /* 出生位置依深度區間隨機 */
    this.depthMin = spec.depth[0];
    this.depthMax = spec.depth[1];
    /* 預覽模式（UI 圖示）：固定於原點，由呼叫端 translate 定位，避免每幀隨機座標造成閃爍 */
    if (opts && opts.preview) {
      this.x = 0; this.y = 0;
    } else {
      this.resetPosition(true);
    }
    this.size = spec.size * (opts && opts.sizeMul ? opts.sizeMul : 1);
    this.weight = spec.weight * (opts && opts.weightMul ? opts.weightMul : 1);
    this.value = Math.round(spec.value * (opts && opts.valueMul ? opts.valueMul : 1));
    this.speed = spec.speed * rand(0.8, 1.2);
    this.isJuvenile = !!(opts && opts.isJuvenile);
    this.isRare = !!(opts && opts.isRare);
    this.dir = (opts && opts.preview) ? 1 : (Math.random() < 0.5 ? -1 : 1);
    this.swimT = rand(0, 6.28);
    this.state = 'swim';       // swim / hide / flee / caught / struggle / escape / released
    this.attached = false;
    this.fleeTimer = 0;
    this.hideTimer = 0;
    this.inkCooldown = 0;
    this.escapeTries = 0;
    this.targetX = this.x;
    this.targetY = this.y;
    this.releaseMsg = '';
    /* 捕獲流程狀態機 */
    this.caughtT = 0;         // 掛鉤停留計時
    this.caughtLine = 0;      // 被捕獲時的釣線長度（計算拖行距離）
    this.escapeAfter = 0;     // 允許逃脫的釣線臨界值
    this.struggleT = 0;       // 掙扎計時
    this.escapeT = 0;         // 逃離計時
    this.escapeVX = 0;        // 逃離水平速度
    this.escapeVY = 0;        // 逃離垂直速度
    this.escapeStyle = spec.escape || 'dart';
    this.trail = [];          // 殘影
    this.shrink = 1;          // 縮團比例（章魚）
  }

  /* 重置到隨機位置（考慮章魚偏好岩石附近） */
  resetPosition(initial) {
    const g = this.game;
    if (this.spec.behavior === 'hide' && g.rocks.length) {
      const r = pick(g.rocks);
      this.x = clamp(r.x + rand(-25, 25), 30, CFG.W - 30);
      this.y = clamp(r.y + rand(-6, 6), CFG.SEA_Y + 40, CFG.FLOOR_Y - 6);
      if (initial) { this.homeX = r.x; this.homeY = r.y; }
    } else {
      this.x = rand(40, CFG.W - 40);
      const f = lerp(this.depthMin, this.depthMax, Math.random());
      this.y = lerp(CFG.SEA_Y + 30, CFG.FLOOR_Y - 8, f);
    }
    this.targetX = this.x; this.targetY = this.y;
  }

  /* 更新 AI */
  update(dt) {
    const g = this.game;
    this.swimT += dt;
    if (this.inkCooldown > 0) this.inkCooldown -= dt;

    /* 殘影壽命 */
    for (let i = this.trail.length - 1; i >= 0; i--) {
      this.trail[i].life -= dt;
      if (this.trail[i].life <= 0) this.trail.splice(i, 1);
    }

    if (this.state === 'released') {
      /* 被放生/逃脫：加速遠離 */
      this.x += this.dir * this.speed * 1.6 * dt;
      this.y -= this.speed * 0.7 * dt;
      if (this.y < CFG.SEA_Y + 6) { this.game.removeCeph(this); return; }
      return;
    }

    /* 被鉤住：跟隨鉤子（Hook Pivot + Offset），由鉤子移動控制 */
    if (this.state === 'caught') {
      const h = g.hook;
      /* 沿鉤子延伸方向，掛在鉤尖下方（偏移由鉤子樞紐 + 釣線方向計算） */
      const offX = Math.sin(h.angle) * this.size * 0.6;
      const offY = Math.cos(h.angle) * this.size * 0.6 + 8;
      this.x = h.x + offX;
      this.y = h.y + offY;
      this.caughtT += dt;
      return;
    }

    /* 掙扎：左右擺動，鉤子由 Game 端持續震動 */
    if (this.state === 'struggle') {
      this.struggleT -= dt;
      /* 身體快速左右擺動 */
      this.x += Math.sin(this.swimT * 22) * 60 * dt;
      /* 章魚：縮成一團 */
      if (this.escapeStyle === 'shrink') this.shrink = Math.max(0.45, this.shrink - dt * 1.2);
      /* 偶爾濺起水花與泡泡 */
      if (Math.random() < 0.15) { Particles.bubble(this.x, this.y); Particles.splash(this.x, this.y); }
      if (this.struggleT <= 0) {
        /* 脫鉤 → 逃離 */
        this.attached = false;
        this.beginEscape();
      }
      return;
    }

    /* 逃離：快速游離 + 殘影/水花/泡泡，離開畫面才移除 */
    if (this.state === 'escape') {
      this.escapeT -= dt;
      const h = g.hook;
      const away = h && h.target === this ? (this.x < h.x ? -1 : 1) : this.dir;
      this.dir = away;
      /* 依物種逃離方向調整（一律朝海中 / 海底，不得向上） */
      let vx = this.escapeVX, vy = this.escapeVY;
      if (this.escapeStyle === 'dash') { this.escapeVX = away * this.speed * 2.4; vx = this.escapeVX; vy = 45; }
      else if (this.escapeStyle === 'shrink') {
        /* 朝礁岩方向逃走（岩石在海中，方向必為向下/斜下） */
        const r = g.nearestRock(this);
        if (r) {
          const dx = r.x - this.x, dy = r.y - this.y, d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
          vx = dx / d * this.speed * 2.6;
          vy = Math.max(0, dy / d * this.speed * 2.6);   /* 章魚：只往礁岩/海底，不向上 */
        }
      } else if (this.escapeStyle === 'inkrand') {
        /* 隨機水平方向，但一律向下往海中 */
        if (this.escapeT > 0.4) { vx = away * this.speed * 1.4; vy = 25; }
        else if (!this._randDir) { this._randDir = (Math.random() < 0.5 ? -1 : 1); }
        if (this._randDir) { vx = this._randDir * this.speed * 2.2; vy = rand(15, 45); }
      }
      this.x += vx * dt;
      this.y += vy * dt;
      /* 硬性限制：永遠不得游到海面以上 */
      if (this.y < CFG.SEA_Y + 6) { this.y = CFG.SEA_Y + 6; vy = Math.max(vy, 10); }
      /* 游離特效：泡泡 / 水花 / 殘影 */
      if (Math.random() < 0.5) Particles.bubble(this.x, this.y);
      if (Math.random() < 0.3) Particles.splash(this.x, this.y);
      this.trail.push({ x: this.x, y: this.y, rot: this.dir, life: 0.3 });
      if (this.trail.length > 12) this.trail.shift();
      /* 完全離開畫面才移除 */
      if (this.x < -60 || this.x > CFG.W + 60 || this.y < -60 || this.y > CFG.FLOOR_Y + 60) {
        this.game.removeCeph(this);
      }
      return;
    }

    const hook = g.hook;
    const dToHook = dist(this.x, this.y, hook.x, hook.y);

    /* 烏賊：當鉤子靠近時機率噴墨並逃跑 */
    if (this.spec.behavior === 'ink' && this.inkCooldown <= 0 && hook.state === 'drop' && dToHook < 70 && Math.random() < 0.3 * dt * 4) {
      this.inkCooldown = 5;
      g.inkTimer = 4;
      Particles.ink(this.x, this.y);
      Sfx.inkBlast();
      this.fleeFrom(hook.x);
      return;
    }

    /* 章魚：靠近岩石躲藏 */
    if (this.spec.behavior === 'hide' && g.rocks.length) {
      const nearest = g.nearestRock(this);
      if (dToHook < 60 || this.state === 'hide') {
        this.state = 'hide';
        const dRock = dist(this.x, this.y, nearest.x, nearest.y);
        if (dRock > 8) {
          this.x += (nearest.x - this.x) * 2 * dt;
          this.y += (nearest.y - this.y) * 2 * dt;
        }
        return;
      } else this.state = 'swim';
    }

    /* 對鉤子產生警戒：快速物種容易逃跑 */
    if (hook.state === 'drop' && dToHook < (50 + this.spec.speed * 6) && Math.random() < this.spec.flee * 0.05) {
      this.fleeFrom(hook.x);
      return;
    }

    /* 一般遊動：隨機目標 + 浮動 */
    if (Math.random() < 0.02 || dist(this.x, this.y, this.targetX, this.targetY) < 20) {
      this.targetX = rand(40, CFG.W - 40);
      const f = rand(this.depthMin, this.depthMax);
      this.targetY = lerp(CFG.SEA_Y + 30, CFG.FLOOR_Y - 8, f);
    }
    const sp = this.spec.behavior === 'bottom' ? this.speed * 0.5 : this.speed;
    this.x += clamp(this.targetX - this.x, -sp * dt, sp * dt);
    this.y += clamp(this.targetY - this.y, -sp * dt * 0.6, sp * dt * 0.6);
    this.dir = this.targetX > this.x ? 1 : -1;
    /* 遊動波浪感 */
    this.y += Math.sin(this.swimT * 2) * 4 * dt;
    this.x += Math.sin(this.swimT * 1.3) * 8 * dt;
    /* 邊界 */
    this.x = clamp(this.x, 30, CFG.W - 30);
    this.y = clamp(this.y, CFG.SEA_Y + 26, CFG.FLOOR_Y - 6);
    if (this.x <= 32 || this.x >= CFG.W - 32) { this.targetX = rand(60, CFG.W - 60); }
  }

  /* 驚慌逃跑 */
  fleeFrom(fx) {
    this.state = 'flee';
    this.dir = this.x < fx ? -1 : 1;
    this.targetX = this.x + this.dir * rand(160, 260);
    this.targetY = this.y - rand(10, 50);
    /* 以高速逃跑數秒 */
    this.fleeTimer = 1.2;
    Sfx.escape();
  }

  /* 嘗試逃脫鉤子（依 flee 機率）：觸發「拖行→掙扎→脫鉤→逃離」流程 */
  tryEscape() {
    if (Math.random() < this.spec.flee * 0.22) {
      this.escapeTries++;
      this.state = 'struggle';
      this.struggleT = rand(0.4, 0.7);
      this.escapeVX = 0; this.escapeVY = 0;
      this.releaseMsg = this.spec.name + ' 用力掙脫逃走了！';
      Sfx.struggle();
      return true;
    }
    return false;
  }

  /* 脫鉤後開始逃離（依物種設定方向與速度） */
  beginEscape() {
    const g = this.game;
    this.state = 'escape';
    this.attached = false;
    this.escapeT = 1.6;
    this._randDir = null;
    this.escapeStyle = this.spec.escape || 'dart';
    const away = this.x < g.hook.x ? -1 : 1;
    this.dir = away;
    /* 依物種：先噴墨再逃離（一律朝海中 / 海底，不得向上） */
    if (this.escapeStyle === 'ink' || this.escapeStyle === 'inkrand') {
      /* 花枝 / 烏賊：噴墨後朝海中斜下 */
      this.inkCooldown = 4;
      g.inkTimer = Math.max(g.inkTimer, 1.8);   /* 畫面短暫變暗 */
      Particles.ink(this.x, this.y);
      Sfx.inkBlast();
      this.escapeVX = away * this.speed * 1.2;
      this.escapeVY = 25;
    } else if (this.escapeStyle === 'shrink') {
      /* 章魚：縮團後朝礁岩（向下）沉入海底 */
      this.escapeVX = away * this.speed * 1.0;
      this.escapeVY = 30;
    } else if (this.escapeStyle === 'dash') {
      /* 軟絲：加速游向深水區 */
      this.escapeVX = away * this.speed * 2.6;
      this.escapeVY = 45;
    } else {
      /* 小管（wiggle）：斜下方衝刺；白魷（dart）：游向中層 */
      this.escapeVX = away * this.speed * 2.2;
      this.escapeVY = rand(15, 45);
    }
    Sfx.snap();
    Particles.splash(this.x, this.y);
  }

  /* 繪製生物 */
  draw(t) {
    const ctx = this.game.ctx;
    const s = this.size;
    /* 殘影（逃離時） */
    for (const tr of this.trail) {
      ctx.globalAlpha = Math.max(0, tr.life / 0.3) * 0.35;
      ctx.save();
      ctx.translate(tr.x, tr.y);
      if (tr.rot < 0) ctx.rotate(Math.PI);
      ctx.fillStyle = this.spec.palette[0];
      ctx.beginPath();
      ctx.ellipse(0, 0, s * 0.5, s * 0.7, 0, 0, 7);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.save();
    ctx.translate(this.x, this.y);
    if (this.state === 'caught') ctx.rotate(this.dir * -0.35);
    else if (this.dir < 0) ctx.rotate(Math.PI);
    /* 章魚縮團（逃離時） */
    if (this.shrink < 1) ctx.scale(this.shrink, this.shrink);
    const swimK = Math.sin(this.swimT * 4) * (this.state === 'caught' ? 0.15 : 1);

    /* 依種類繪製身體 */
    switch (this.spec.id) {
      case 'xiaoquan': this.drawSquid(s, swimK, true); break;
      case 'suoguan': this.drawSquid(s, swimK, false); break;
      case 'ruansi': this.drawSoftsquid(s, swimK); break;
      case 'huazhi': this.drawCuttle(s, swimK, true); break;
      case 'wusei': this.drawCuttle(s, swimK, false); break;
      case 'zhangyu': this.drawOcto(s, swimK); break;
      /* 擴充物種：魷類 / 烏賊類 / 章魚類，直接重用現有繪製函式 */
      case 'rocket': this.drawSquid(s, swimK, true); break;      /* 火箭魷：偏白魷體色 */
      case 'nini': case 'changwan': this.drawSquid(s, swimK, false); break;
      case 'giantsq': this.drawSquid(s, swimK, false); break;    /* 大王魷：深色大型魷 */
      case 'jiwuzei':
        this.drawCuttle(s, swimK, false);
        break;
      case 'duanxiao': case 'giantoct': case 'mimic': case 'blueoct': case 'vampire':
        this.drawOcto(s, swimK);
        break;
    }
    /* 特殊標記 */
    if (this.isJuvenile) {
      ctx.fillStyle = '#ffd54d';
      ctx.font = '10px ' + FONT;
      ctx.textAlign = 'center';
      ctx.fillText('幼體', 0, -s - 8);
    }
    if (this.isRare) {
      glow('#ffe08a', 14);
      ctx.strokeStyle = '#ffe08a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, s + 5, 0, 7); ctx.stroke();
      noGlow();
      ctx.fillStyle = '#ffe08a';
      ctx.font = '10px ' + FONT;
      ctx.textAlign = 'center';
      ctx.fillText('稀有', 0, -s - 8);
    }
    ctx.restore();
  }

  /* --- 魷魚 / 小管（紡錘形 + 鰭 + 觸腕） --- */
  drawSquid(s, k, isWhite) {
    const c = this.spec.palette;
    const w = s * 0.55;
    /* 觸腕 */
    ctx.strokeStyle = c[1]; ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (let i = -2; i <= 2; i++) {
      ctx.moveTo(i * w * 0.3, s * 0.45);
      ctx.quadraticCurveTo(i * w * 0.5 + Math.sin(k + i) * 2, s * 0.8, i * w * 0.4 + Math.sin(k * 1.5 + i) * 3, s * 1.05);
    }
    ctx.stroke();
    /* 身體 */
    const g = ctx.createLinearGradient(-w, 0, w, 0);
    g.addColorStop(0, c[1]); g.addColorStop(1, c[0]);
    ctx.fillStyle = isWhite ? 'rgba(235,246,250,0.88)' : g;
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.bezierCurveTo(w, -s * 0.6, w * 1.15, s * 0.4, 0, s * 0.5);
    ctx.bezierCurveTo(-w * 1.15, s * 0.4, -w, -s * 0.6, 0, -s);
    ctx.closePath(); ctx.fill();
    /* 鰭 */
    ctx.fillStyle = c[2];
    ctx.beginPath();
    ctx.moveTo(-w * 0.3, s * 0.1);
    ctx.quadraticCurveTo(0, s * 0.3 + Math.sin(k) * 2, w * 0.3, s * 0.1);
    ctx.quadraticCurveTo(0, s * 0.5, -w * 0.3, s * 0.1);
    ctx.closePath(); ctx.fill();
    /* 眼睛 */
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath(); ctx.arc(-w * 0.35, -s * 0.3, 2.2, 0, 7); ctx.arc(w * 0.35, -s * 0.3, 2.2, 0, 7); ctx.fill();
    /* 小管的斑點 */
    if (!isWhite) {
      ctx.fillStyle = 'rgba(127,90,117,0.7)';
      for (let i = 0; i < 5; i++) {
        const px = (i % 2 ? -1 : 1) * w * 0.4;
        ctx.beginPath(); ctx.arc(px, -s * 0.1 + i * 4, 1.4, 0, 7); ctx.fill();
      }
    }
  }

  /* --- 軟絲（橢圓鰭包全身） --- */
  drawSoftsquid(s, k) {
    const w = s * 0.6;
    ctx.strokeStyle = 'rgba(185,141,94,0.9)'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = -2; i <= 2; i++) {
      ctx.moveTo(i * w * 0.25, s * 0.4);
      ctx.quadraticCurveTo(i * w * 0.4 + Math.sin(k + i) * 2, s * 0.75, i * w * 0.35, s * 1.0);
    }
    ctx.stroke();
    ctx.fillStyle = this.spec.palette[0];
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.bezierCurveTo(w * 1.3, -s * 0.5, w * 1.3, s * 0.4, 0, s * 0.55);
    ctx.bezierCurveTo(-w * 1.3, s * 0.4, -w * 1.3, -s * 0.5, 0, -s);
    ctx.closePath(); ctx.fill();
    /* 包全身的鰭 */
    ctx.fillStyle = 'rgba(232,201,160,0.85)';
    ctx.beginPath();
    ctx.ellipse(0, s * 0.05, w * 1.5, s * 0.95, 0, 0, 7);
    ctx.fill();
    ctx.strokeStyle = 'rgba(185,141,94,0.5)'; ctx.lineWidth = 1.5;
    ctx.stroke();
    /* 斑點 */
    ctx.fillStyle = 'rgba(170,110,70,0.8)';
    for (let i = 0; i < 6; i++) {
      const px = (i % 2 ? -1 : 1) * rand(3, w * 0.9);
      const py = rand(-s * 0.5, s * 0.4);
      ctx.beginPath(); ctx.arc(px, py, 1.8, 0, 7); ctx.fill();
    }
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath(); ctx.arc(-w * 0.3, -s * 0.3, 2.4, 0, 7); ctx.arc(w * 0.3, -s * 0.3, 2.4, 0, 7); ctx.fill();
  }

  /* --- 花枝 / 烏賊（寬扁外套膜 + 兩側波浪鰭） --- */
  drawCuttle(s, k, isHuazhi) {
    const w = s * 0.85;
    const g = ctx.createLinearGradient(-w, 0, w, 0);
    g.addColorStop(0, this.spec.palette[1]); g.addColorStop(0.5, this.spec.palette[0]); g.addColorStop(1, this.spec.palette[1]);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.95);
    ctx.bezierCurveTo(w * 1.1, -s * 0.5, w * 1.0, s * 0.55, 0, s * 0.7);
    ctx.bezierCurveTo(-w * 1.0, s * 0.55, -w * 1.1, -s * 0.5, 0, -s * 0.95);
    ctx.closePath(); ctx.fill();
    /* 兩側波浪鰭 */
    ctx.fillStyle = this.spec.palette[2];
    for (let side = -1; side <= 1; side += 2) {
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.8);
      for (let i = 0; i <= 4; i++) {
        const px = side * w * (0.85 - i * 0.12);
        const py = -s * 0.8 + i * s * 0.35 + Math.sin(k + i + side) * 3;
        ctx.quadraticCurveTo(px + side * 8, py, px + side * 14, py);
        ctx.lineTo(px + side * 14, py + 4);
      }
      ctx.closePath(); ctx.fill();
    }
    /* 紋路 */
    ctx.strokeStyle = 'rgba(90,60,35,0.55)'; ctx.lineWidth = 1;
    for (let i = 1; i <= 3; i++) {
      ctx.beginPath(); ctx.moveTo(-w * 0.7, -s * 0.6 + i * s * 0.3);
      ctx.quadraticCurveTo(0, -s * 0.4 + i * s * 0.3, w * 0.7, -s * 0.6 + i * s * 0.3);
      ctx.stroke();
    }
    if (isHuazhi) {
      /* 花枝虎斑 */
      ctx.fillStyle = 'rgba(122,82,48,0.7)';
      for (let i = 0; i < 4; i++) {
        ctx.beginPath(); ctx.ellipse((i % 2 ? 1 : -1) * w * 0.4, -s * 0.3 + i * s * 0.22, w * 0.22, s * 0.12, 0.4, 0, 7); ctx.fill();
      }
    } else {
      /* 烏賊墨點 */
      ctx.fillStyle = 'rgba(60,48,35,0.75)';
      for (let i = 0; i < 7; i++) {
        ctx.beginPath(); ctx.arc((i % 2 ? 1 : -1) * rand(4, w * 0.8), rand(-s * 0.5, s * 0.5), 2, 0, 7); ctx.fill();
      }
    }
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath(); ctx.arc(-w * 0.3, -s * 0.4, 2.6, 0, 7); ctx.arc(w * 0.3, -s * 0.4, 2.6, 0, 7); ctx.fill();
  }

  /* --- 章魚（圓頭 + 八腕足） --- */
  drawOcto(s, k) {
    const w = s * 0.7;
    ctx.strokeStyle = this.spec.palette[1]; ctx.lineWidth = 2.5;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + Math.PI * 0.5;
      const ox = Math.cos(a) * w * 0.6;
      const oy = Math.sin(a) * w * 0.6;
      const lx = Math.cos(a) * w * 1.5 + Math.sin(k * 0.8 + i) * 3;
      const ly = Math.sin(a) * w * 1.5 + Math.cos(k * 0.8 + i) * 3;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.quadraticCurveTo(ox * 1.5, oy * 1.5, lx, ly); ctx.stroke();
    }
    const g = ctx.createRadialGradient(-w * 0.3, -w * 0.3, 2, 0, 0, w);
    g.addColorStop(0, this.spec.palette[2]); g.addColorStop(1, this.spec.palette[0]);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, w, 0, 7); ctx.fill();
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath(); ctx.arc(-w * 0.28, -w * 0.2, 2.8, 0, 7); ctx.arc(w * 0.28, -w * 0.2, 2.8, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(-w * 0.32, -w * 0.26, 1, 0, 7); ctx.arc(w * 0.24, -w * 0.26, 1, 0, 7); ctx.fill();
    /* 吸盤 */
    ctx.fillStyle = 'rgba(120,60,45,0.6)';
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + Math.PI * 0.5;
      ctx.beginPath(); ctx.arc(Math.cos(a) * w * 1.05, Math.sin(a) * w * 1.05, 1.6, 0, 7); ctx.fill();
    }
  }
}

/* ============================================================
   [模組 11] 主遊戲類 Game
   ============================================================ */
class Game {
  constructor() {
    this.ctx = ctx;
    this.time = 0;
    this.bgTime = 0;           // 背景凍結時間：Modal 開啟時停止推進
    this.state = 'menu';       // menu / settings / brief / play / card / choice / shop / encyclopedia / help / clear / end
    this.paused = false;
    this.frame = 0;

    /* 玩家持久資料 */
    const save = loadSave() || {};
    this.points = save.points || 0;
    this.conserve = save.conserve || 0;
    this.encyclopedia = save.encyclopedia || {};  // { speciesId: count }
    this.upgrades = save.upgrades || {};          // { upgradeId: level }
    this.badges = save.badges || [];
    this.totalCatch = save.totalCatch || 0;
    this.levelIndex = save.levelIndex || 0;

    /* 本關狀態（預設第一站作為主選單背景） */
    this.level = LEVELS[0];
    Decor.gen(this.level.loc, 20240808);
    this.rocks = Decor.list.filter(d => d.type === 'rock');
    if (!this.rocks.length) this.rocks = [{ x: CFG.W * 0.3, y: CFG.FLOOR_Y - 20 }, { x: CFG.W * 0.7, y: CFG.FLOOR_Y - 16 }];
    this.levelCatch = {};
    this.timeLeft = 0;
    this.weather = 'sunny';
    this.tide = 'high';
    this.creatures = [];
    this.hook = { x: 0, y: 0, angle: 0, dir: 1, state: 'idle', line: CFG.ARM_LEN, target: null, liftFail: 0, t: 0, vibT: 0, fxDone: false };
    this.inkTimer = 0;
    this.catchCount = 0;
    this.missionDone = false;
    this.spawnTimer = 0;
    this.sonarTimer = 0;
    this.toasts = [];
    this.floats = [];
    this.pulses = [];       // 商店點擊縮放動畫
    this.buyGlow = {};      // 道具圖示購買後發光 { itemId: 剩餘秒數 }
    this.shopIconPos = {};  // 商店圖示座標（供購買特效使用）
    this.mouse = { x: -100, y: -100, down: false };
    this.buttons = [];
    this.prevState = 'menu';

    /* 暫存：捕獲等待選擇 */
    this.pendingCatch = null;
    this.cardData = null;
    this.encyPage = 0;   /* 圖鑑分頁（物種擴充後用） */

    /* 測試模式（GameState.TEST_MODE / 進行中的 PLAYING + testing 旗標）
       進入時快照正式資料；離開未儲存則完全還原，不污染正式進度。 */
    this.test = {
      active: false,        // 目前身處測試階段
      snapshot: null,       // 進入測試時的正規資料備份
      cfg: {                // 測試模式設定（自由選擇）
        levelIndex: 0,
        speciesIdx: 0,
        timeOfDay: 'day',
        season: 'spring',
        depth: 'near',
        probability: 1.0,
        infiniteTime: true,
        infinitePoints: true,
        infiniteConserve: true
      },
      debug: false          // Debug Panel 開關
    };

    this.sfxOn = true;
    this.fsPref = loadFsPref();   // 全螢幕偏好（localStorage 記憶）
    this.clearConfirm = false;    // 清除資料確認視窗旗標
    this.fsFade = 0;              // 全螢幕切換淡入動畫
    this.boatShake = 0;           // 收穫時船隻晃動強度
    this.camShake = 0;            // 相機震動（噴墨/逃離）
  }

  /* ---------- 關卡初始化 ---------- */
  startLevel(idx) {
    this.levelIndex = clamp(idx, 0, LEVELS.length - 1);
    const L = LEVELS[this.levelIndex];
    this.level = L;
    this.timeLeft = L.time;
    this.weather = pick(L.weather);
    this.tide = pick(['high', 'mid', 'low']);
    this.levelCatch = {};
    this.creatures = [];
    this.rocks = [];
    this.hook = { x: CFG.BOAT_X, y: 0, angle: 0, dir: 1, state: 'idle', line: CFG.ARM_LEN, target: null, liftFail: 0, t: 0, vibT: 0, fxDone: false };
    this.inkTimer = 0;
    this.catchCount = 0;
    this.missionDone = false;
    this.spawnTimer = 0;
    this.targetSpawned = 0;    // 目標物種已生成數量（每關從 0 起算）
    this.toasts = [];
    this.floats = [];
    this.state = 'brief';
    /* 產生場景裝飾與岩石 */
    Decor.gen(L.loc, this.levelIndex * 7919 + 13);
    this.rocks = Decor.list.filter(d => d.type === 'rock');
    if (!this.rocks.length) this.rocks = [{ x: CFG.W * 0.3, y: CFG.FLOOR_Y - 20 }, { x: CFG.W * 0.7, y: CFG.FLOOR_Y - 16 }];
    /* 初始生物 */
    for (let i = 0; i < 6; i++) this.spawnCeph();
    this.pendingCatch = null;
    this.cardData = null;
    saveState(this);
    Sfx.startWaves();
    Sfx.boatHum();
    Sfx.seagull();
  }

  /* 產生一隻生物（依棲地/季節/時間權重；測試模式可覆寫出現機率） */
  spawnCeph() {
    const L = this.level;
    /* 目標物種配額：僅正式遊玩（brief/play）計數並設上限，選單背景不消耗配額 */
    const inSession = this.state === GameState.MISSION || this.state === GameState.PLAYING;
    const targetSid = (L && L.mission) ? L.mission.sid : null;
    const targetCap = (L && L.spawnCount) ? L.spawnCount : 0;
    const wts = [];
    /* 測試模式：強制指定物種 + 指定出現機率 */
    const testMode = this.test && this.test.active;
    const forced = testMode ? SPECIES[this.test.cfg.speciesIdx] : null;
    for (const sp of SPECIES) {
      let w = (sp.habitatW[L.loc] || 0.05) * (sp.seasonW[L.season] || 1) * (sp.timeW[L.tod] || 1);
      if (testMode) {
        if (forced && sp.id === forced.id) w = 1.0 * this.test.cfg.probability;   // 指定物種
        else w = 0.02;                                                             // 其餘幾乎不出現
      } else {
        if (sp.id === targetSid) {
          if (inSession && targetCap > 0 && this.targetSpawned >= targetCap) w = 0; // 已達上限，不再生成
          else w *= 2.2 * (1 + this.upgrade('bait') * 0.7);                           // 任務目標 + 誘餌加成
        }
        if (sp.id === targetSid && this.missionDone) w *= 0.6;               // 任務完成後遞減
        if (L.tod === 'night' && this.upgrade('light') > 0) w *= 1 + this.upgrade('light') * 0.35;
      }
      if (w > 0.001) wts.push({ sp, w });
    }
    if (!wts.length) return;
    const total = wts.reduce((a, b) => a + b.w, 0);
    let r = Math.random() * total, chosen = wts[0].sp;
    for (const it of wts) { r -= it.w; if (r <= 0) { chosen = it.sp; break; } }
    const opts = {};
    if (!testMode && Math.random() < 0.2 && chosen.weight > 1) { opts.isJuvenile = true; opts.sizeMul = 0.6; opts.weightMul = 0.5; opts.valueMul = 0.4; }
    if (!testMode && Math.random() < 0.06) { opts.isRare = true; opts.valueMul = 2.2; }
    this.postSpawn(chosen, inSession, targetSid);
    const c = new Ceph(chosen, this, opts);
    this.creatures.push(c);
    return c;
  }
  /* 生成後：正式遊玩中每次「目標物種」誕生都計數一次（捕獲前逃逸仍視為已生成，不重複補） */
  postSpawn(chosen, inSession, targetSid) {
    if (!this.test || !this.test.active) {
      if (inSession && targetSid && chosen.id === targetSid) this.targetSpawned += 1;
    }
  }

  removeCeph(c) {
    const i = this.creatures.indexOf(c);
    if (i >= 0) this.creatures.splice(i, 1);
  }

  nearestRock(c) {
    let best = null, bd = 1e9;
    for (const r of this.rocks) {
      const d = dist(c.x, c.y, r.x, r.y);
      if (d < bd) { bd = d; best = r; }
    }
    return best;
  }

  upgrade(id) { return this.upgrades[id] || 0; }
  shopItem(id) { return SHOP.find(s => s.id === id); }
  shopPrice(item) { return Math.round(item.base + item.step * this.upgrade(item.id)); }

  /* ---------- 升級數值計算 ---------- */
  reelSpeed() {
    return CFG.REEL_SPEED * (1 + this.upgrade('reel') * 0.22);
  }
  capacity() {
    return CFG.BASE_CAPACITY + this.upgrade('reel') * 1.2;
  }
  valueMult() {
    return 1 + this.upgrade('gear') * 0.1;
  }

  /* Popup / Modal 狀態：開啟時背景場景完全停止（GameState.PAUSED / 資訊卡等） */
  isModal() {
    return this.state === 'card' || this.state === 'choice' || this.state === 'shop' ||
      this.state === 'settings' || this.state === 'help' || this.state === 'encyclopedia' ||
      this.state === 'end' || this.state === 'paused' || this.state === 'test';
  }

  /* ---------- 主更新迴圈 ---------- */
  update(dt) {
    this.time += dt;
    this.frame++;
    /* 暫停（GameState.PAUSED）：停止所有進度相關更新，僅保留 UI 渲染。
       粒子 / 泡泡 / 生物 / 鉤子 / SpawnTimer / Countdown / 動畫全部凍結。 */
    if (this.state === GameState.PAUSED) {
      this.fsFade -= dt;
      if (this.fsFade < 0) this.fsFade = 0;
      return;
    }
    Particles.update(dt);
    if (!this.isModal()) Bubbles.update(dt);
    if (!this.isModal()) this.bgTime = this.time;
    if (this.inkTimer > 0) this.inkTimer -= dt;
    if (this.fsFade > 0) this.fsFade -= dt;
    if (this.boatShake > 0) this.boatShake -= dt;
    if (this.camShake > 0) this.camShake -= dt;
    /* 浮動文字 */
    for (let i = this.floats.length - 1; i >= 0; i--) {
      const f = this.floats[i];
      f.y -= 30 * dt; f.life += dt;
      if (f.life > 1.2) this.floats.splice(i, 1);
    }
    /* 通知 */
    for (let i = this.toasts.length - 1; i >= 0; i--) {
      const t = this.toasts[i];
      t.life += dt;
      if (t.life > t.dur) this.toasts.splice(i, 1);
    }
    /* 商店動畫計時（點擊脈衝 / 圖示發光） */
    for (let i = this.pulses.length - 1; i >= 0; i--) {
      this.pulses[i].t += dt;
      if (this.pulses[i].t > this.pulses[i].max) this.pulses.splice(i, 1);
    }
    for (const k in this.buyGlow) {
      this.buyGlow[k] -= dt;
      if (this.buyGlow[k] <= 0) delete this.buyGlow[k];
    }

    if (this.paused) return;
    switch (this.state) {
      case 'play': this.updatePlay(dt); break;
      case 'menu': this.updateMenu(dt); break;
    }
    Sfx.seagull();
  }

  updateMenu(dt) {
    /* 選單背景生物遊動 */
    if (Math.random() < 0.3 && this.creatures.length < 8) this.spawnCeph();
    for (const c of this.creatures) c.update(dt);
  }

  /* ---------- 遊玩狀態更新 ---------- */
  updatePlay(dt) {
    const h = this.hook;
    /* 測試模式：無限時間（不遞減計時，也不觸發結束） */
    const infTime = this.test && this.test.active && this.test.cfg.infiniteTime;
    if (!infTime) this.timeLeft -= dt;

    /* 計時結束 */
    if (!infTime && this.timeLeft <= 0) {
      this.timeLeft = 0;
      this.finishLevel();
      return;
    }

    /* 鉤子狀態機：SWING / THROW / HOOKED / RETURNING / STRUGGLE / ARRIVE_BOAT / COLLECT */
    this.updateHook(dt);

    /* 生物 AI */
    for (const c of this.creatures) c.update(dt);

    /* 生成更多生物 */
    this.spawnTimer -= dt;
    const maxC = 7 + this.levelIndex;
    if (this.spawnTimer <= 0 && this.creatures.length < maxC) {
      this.spawnCeph();
      this.spawnTimer = rand(1.5, 3.5);
    }

    /* 聲納 */
    if (this.upgrade('sonar') > 0) {
      this.sonarTimer -= dt;
      if (this.sonarTimer <= 0) { this.sonarTimer = 4.5 - this.upgrade('sonar'); Particles.sparkle(h.x, h.y, '#7ef0ff'); }
    }
  }

  /* ---------- 鉤子狀態機（捕獲流程） ---------- */
  updateHook(dt) {
    const h = this.hook;
    switch (h.state) {
      case 'idle': this.hookIdle(dt); break;
      case 'drop': this.hookDrop(dt); break;
      case 'caught': this.hookCaught(dt); break;
      case 'returning': this.hookReturning(dt); break;
      case 'struggle': this.hookStruggle(dt); break;
      case 'arrive': this.hookArrive(dt); break;
      case 'collect': this.hookCollect(dt); break;
    }
  }

  /* SWING：吊臂擺動 */
  hookIdle(dt) {
    const h = this.hook;
    h.angle += h.dir * CFG.SWING_SPEED * dt;
    if (h.angle > CFG.SWING_MAX) { h.angle = CFG.SWING_MAX; h.dir = -1; }
    if (h.angle < CFG.SWING_MIN) { h.angle = CFG.SWING_MIN; h.dir = 1; }
    h.x = CFG.BOAT_X + Math.sin(h.angle) * CFG.ARM_LEN;
    h.y = CFG.PIVOT_Y + Math.cos(h.angle) * CFG.ARM_LEN;
  }

  /* THROW：放下捕撈器 */
  hookDrop(dt) {
    const h = this.hook;
    h.line += CFG.DROP_SPEED * dt;
    const current = this.tide === 'high' ? 8 : (this.tide === 'mid' ? 3 : 0);
    h.x += Math.sin(this.time * 0.7) * current * dt;
    this.hookPos(h);
    this.checkCatch();
    if (h.y >= CFG.FLOOR_Y - 2) {
      h.y = CFG.FLOOR_Y - 2;
      Particles.splash(h.x, CFG.SEA_Y);
      Particles.splash(h.x, h.y);
      Sfx.splash();
      h.state = 'idle'; h.line = CFG.ARM_LEN;
    }
  }

  /* HOOKED：剛掛住，短暫停留 */
  hookCaught(dt) {
    const h = this.hook;
    const c = h.target;
    if (!c) { h.state = 'idle'; h.line = CFG.ARM_LEN; return; }
    /* 太重：無法拉起 */
    if (c.weight > this.capacity()) {
      h.liftFail += dt;
      if (h.liftFail > 0.5) {
        this.toast('太重了！「' + c.spec.name + '」需要升級捲線器');
        Sfx.deny();
        c.state = 'flee'; c.attached = false; c.fleeFrom(h.x);
        h.target = null; h.state = 'idle'; h.line = CFG.ARM_LEN; h.liftFail = 0;
      } else { this.hookPos(h); }
      return;
    }
    h.liftFail = 0;
    h.t += dt;
    if (h.t >= 0.12) {          /* 掛住後短暫停留再開始收線 */
      c.escapeAfter = c.caughtLine - (c.caughtLine - CFG.ARM_LEN) * rand(0.15, 0.30); /* 拖行 15%~30% 後才允許逃脫 */
      h.state = 'returning';
      h.t = 0;
      Sfx.startReel();
    }
  }

  /* RETURNING：拉回船上（拖行） */
  hookReturning(dt) {
    const h = this.hook;
    const c = h.target;
    if (!c) { h.state = 'idle'; h.line = CFG.ARM_LEN; return; }
    /* 逃脫嘗試：拖行超過 15%~30% 距離後才可能 */
    if (c.escapeTries < 2 && h.line <= c.escapeAfter && Math.random() < dt * c.spec.flee * 0.5) {
      if (c.tryEscape()) {
        this.toast('「' + c.spec.name + '成功逃脫！」　小知識：' + (c.spec.escapeHint || '受驚的頭足類會迅速逃離。'), 3);
        this.camShake = 0.4;
        h.state = 'struggle';
        h.t = 0;
        Sfx.stopReel();
        return;
      }
    }
    /* 拉回水面（依重量減速） */
    const sp = this.reelSpeed() / (1 + c.weight * 0.28);
    h.line -= sp * dt;
    this.hookPos(h);
    /* 到達船上 */
    if (h.line <= CFG.ARM_LEN + 4) {
      h.line = CFG.ARM_LEN + 4;
      h.state = 'arrive';
      h.t = 0;
      Sfx.stopReel();
    }
  }

  /* STRUGGLE：鉤子震動等待生物完成掙扎或脫鉤 */
  hookStruggle(dt) {
    const h = this.hook;
    const c = h.target;
    h.t += dt;
    h.vibT += dt;
    if (!c || c.attached === false) {
      /* 已脫鉤：鉤子回彈到待機 */
      h.target = null; h.state = 'idle'; h.line = CFG.ARM_LEN; h.t = 0; h.vibT = 0;
      Sfx.stopReel();
      return;
    }
    /* 生物仍在掙扎：鉤子原地震動 */
    this.hookPos(h);
  }

  /* ARRIVE_BOAT：到達船上，停留約 0.5 秒 */
  hookArrive(dt) {
    const h = this.hook;
    const c = h.target;
    if (!c) { h.state = 'idle'; h.line = CFG.ARM_LEN; return; }
    h.t += dt;
    if (h.t >= 0.5) {
      h.state = 'collect';
      h.t = 0;
      Sfx.boatHum();
    }
  }

  /* COLLECT：收穫動畫 + 研究點數 */
  hookCollect(dt) {
    const h = this.hook;
    const c = h.target;
    if (!c) { h.state = 'idle'; h.line = CFG.ARM_LEN; return; }
    if (!h.fxDone) {
      h.fxDone = true;
      /* 船隻輕微晃動 */
      this.boatShake = 0.6;
      /* 收穫粒子效果 */
      Particles.catchBurst(CFG.BOAT_X, CFG.BOAT_Y - 20);
      Particles.splash(CFG.BOAT_X, CFG.SEA_Y);
      for (let i = 0; i < 10; i++) Particles.sparkle(CFG.BOAT_X + rand(-30, 30), CFG.BOAT_Y - rand(0, 40), '#7ef0ff');
      Sfx.researchChime();
    }
    h.t += dt;
    if (h.t >= 0.6) {
      this.catchSuccess(c);
    }
  }

  /* 計算鉤子位置（沿吊臂方向放下） */
  hookPos(h) {
    h.x = CFG.BOAT_X + Math.sin(h.angle) * h.line;
    h.y = CFG.PIVOT_Y + Math.cos(h.angle) * h.line;
  }

  /* 放下捕撈器 */
  dropHook() {
    const h = this.hook;
    if (h.state !== 'idle') return;
    h.state = 'drop';
    h.line = CFG.ARM_LEN;
    this.hookPos(h);
    Sfx.drop();
    Particles.splash(h.x, h.y);
  }

  /* 檢查是否抓到生物 */
  checkCatch() {
    const h = this.hook;
    for (const c of this.creatures) {
      if (c.state === 'caught' || c.state === 'released' || c.state === 'struggle' || c.state === 'escape') continue;
      const d = dist(h.x, h.y, c.x, c.y);
      if (d < c.size + 8) {
        h.target = c;
        c.attached = true;
        c.state = 'caught';
        c.caughtT = 0;
        c.caughtLine = h.line;
        h.state = 'caught';
        h.liftFail = 0;
        h.t = 0;
        h.fxDone = false;
        Particles.catchBurst(c.x, c.y);
        Sfx.catchPop();
        return;
      }
    }
  }

  /* ---------- 捕獲成功處理（於 COLLECT 動畫結束時呼叫） ---------- */
  catchSuccess(c) {
    this.removeCeph(c);
    this.hook.state = 'idle';
    this.hook.target = null;
    this.hook.line = CFG.ARM_LEN;
    this.hook.t = 0;
    this.hook.vibT = 0;
    this.hook.fxDone = false;
    this.hook.liftFail = 0;
    this.hookPos(this.hook);
    this.catchCount++;
    this.totalCatch++;
    this.levelCatch[c.spec.id] = (this.levelCatch[c.spec.id] || 0) + 1;

    /* 第一次捕獲：解鎖圖鑑 */
    const firstTime = !(this.encyclopedia[c.spec.id]);
    this.encyclopedia[c.spec.id] = (this.encyclopedia[c.spec.id] || 0) + 1;

    /* 計算研究點數 */
    const pts = Math.round(c.value * this.valueMult());
    this.floats.push({ x: CFG.BOAT_X, y: CFG.BOAT_Y - 10, text: '+' + pts + ' 研究點', color: '#7ef0ff', life: 0 });

    /* 任務目標完成檢查 */
    this.checkMission(c.spec.id);

    /* 保育選擇：幼體或稀有 → 進入 choice 畫面 */
    if (c.isJuvenile || c.isRare) {
      this.pendingCatch = { ceph: c, pts, firstTime };
      this.state = 'choice';
    } else {
      /* 直接給點數並顯示資訊卡 */
      this.addPoints(pts);
      this.showCard(c, firstTime, pts);
    }
    saveState(this);
  }

  checkMission(sid) {
    const m = this.level.mission;
    if (sid !== m.sid || this.missionDone) return;
    const count = this.levelCatch[sid] || 0;
    if (count >= m.n) {
      this.missionDone = true;
      const badge = '研究徽章・' + this.level.name;
      if (!this.badges.includes(badge)) this.badges.push(badge);
      this.toast('研究任務完成！獲得徽章：' + badge, 3);
      Sfx.fanfare();
    }
  }

  addPoints(n) {
    /* 測試模式：無限研究點（不實際增減，僅顯示效果） */
    if (this.test && this.test.active && this.test.cfg.infinitePoints) { this.toast('+∞ 研究點（測試）', 1.2); return; }
    this.points += n;
    saveState(this);
  }
  addConserve(n) {
    /* 測試模式：無限保育點 */
    if (this.test && this.test.active && this.test.cfg.infiniteConserve) { this.toast('+∞ 保育點（測試）', 1.2); return; }
    this.conserve += n;
    saveState(this);
  }

  /* 顯示資訊卡（第一次完整 / 之後簡短） */
  showCard(ceph, firstTime, pts) {
    this.cardData = { ceph, firstTime, pts };
    this.state = 'card';
    if (firstTime) Sfx.unlockJingle();
    else Sfx.coin();
  }

  /* ---------- 任務完成/結束關卡 ---------- */
  finishLevel() {
    Sfx.stopReel();
    const missionClear = this.missionDone;
    /* 結算獎勵 */
    const bonus = missionClear ? 100 + this.levelIndex * 30 : 20;
    this.addPoints(bonus);
    this.floats.push({ x: CFG.BOAT_X, y: 200, text: '關卡完成 +' + bonus + ' 研究點', color: '#ffe08a', life: 0 });
    this.toast('本關捕獲 ' + this.catchCount + ' 隻頭足類', 2.5);
    this.state = 'clear';
    Sfx.researchChime();
    saveState(this);
  }

  /* ---------- UI 按鈕 ---------- */
  addBtn(label, x, y, w, h, fn, color, state) {
    const b = new UIButton(label, { x, y, w, h, fn, color, state });
    this.buttons.push(b);
    return b;
  }
  hitButton(b) {
    return this.mouse.x >= b.x && this.mouse.x <= b.x + b.w && this.mouse.y >= b.y && this.mouse.y <= b.y + b.h;
  }
  hitRect(x, y, w, h) {
    return this.mouse.x >= x && this.mouse.x <= x + w && this.mouse.y >= y && this.mouse.y <= y + h;
  }
  /* ---------- 全螢幕 ---------- */
  toggleFullscreen() {
    if (!isFsSupported()) {
      this.toast('此瀏覽器不支援全螢幕模式', 2.5);
      Sfx.deny();
      return;
    }
    Sfx.click();
    this.fsFade = 0.5;   /* 淡入動畫 */
    if (isFullscreen()) {
      exitFullscreen();
      this.fsPref = false;
    } else {
      requestFullscreen();
      this.fsPref = true;
    }
    saveFsPref(this.fsPref);
  }
  toast(text, dur) {
    this.toasts.push({ text, life: 0, dur: dur || 2 });
  }

  /* ---------- 清除所有遊戲資料（僅移除本遊戲專用 Key，不使用 localStorage.clear()） ---------- */
  clearData() {
    try { localStorage.removeItem(CFG.SAVE_KEY); } catch (e) { /* 忽略 */ }
    try { localStorage.removeItem(FS_KEY); } catch (e) { /* 忽略 */ }
    this.points = 0;
    this.conserve = 0;
    this.encyclopedia = {};
    this.upgrades = {};
    this.badges = [];
    this.totalCatch = 0;
    this.levelIndex = 0;
    this.levelCatch = {};
    this.missionDone = false;
    this.fsPref = loadFsPref();
    this.clearConfirm = false;
    this.toast('遊戲資料已成功清除。', 3);
    this.state = 'menu';
    Sfx.click();
  }

  /* ---------- 視覺疊加（夜晚/暴風雨/墨汁） ---------- */
  drawOverlays() {
    const tod = this.level ? this.level.tod : 'day';
    /* 夜晚昏暗 */
    if (tod === 'night') {
      const light = this.upgrade('light');
      const alpha = 0.4 - light * 0.1;
      if (alpha > 0) {
        ctx.fillStyle = 'rgba(5,12,45,' + alpha.toFixed(3) + ')';
        ctx.fillRect(0, 0, CFG.W, CFG.H);
      }
    }
    /* 墨汁視野遮蔽 */
    if (this.inkTimer > 0) {
      const a = Math.min(0.45, this.inkTimer * 0.15);
      ctx.fillStyle = 'rgba(10,8,18,' + a.toFixed(3) + ')';
      ctx.fillRect(0, 0, CFG.W, CFG.H);
      /* 若防墨裝置已購買，快速消散 */
      if (this.upgrade('ink') > 0) this.inkTimer = Math.min(this.inkTimer, 0.8);
    }
    /* 暴風雨 */
    if (this.weather === 'stormy') {
      ctx.fillStyle = 'rgba(20,30,50,0.2)';
      ctx.fillRect(0, 0, CFG.W, CFG.H);
    }
  }

  /* ---------- 繪製 ---------- */
  render() {
    const t = this.time;
    /* 相機震動（噴墨/逃離） */
    let shx = 0, shy = 0;
    if (this.camShake > 0) {
      shx = (Math.random() - 0.5) * 10 * this.camShake;
      shy = (Math.random() - 0.5) * 10 * this.camShake;
      ctx.save();
      ctx.translate(shx, shy);
    }
    /* 背景 */
    const modal = this.isModal();
    const bt = modal ? this.bgTime : this.time;
    Backdrop.draw(ctx, this, bt);
    Decor.draw(bt, false);

    /* 生物（背景層）：Modal 開啟時不繪製（避免殘留生物在 Popup 後閃爍） */
    for (const c of this.creatures) {
      if (!modal && (this.state === 'play' || this.state === 'brief' || this.state === 'clear' || this.state === 'choice' || this.state === 'menu')) {
        c.draw(t);
      }
    }

    /* 前景裝飾 */
    if (!modal && this.state !== 'menu' && this.state !== 'end') {
      Decor.draw(bt, true);
    }

    /* 船與吊臂、鉤子 */
    if (!modal && (this.state === 'play' || this.state === 'brief' || this.state === 'clear' || this.state === 'choice')) {
      this.drawBoat();
      this.drawHook();
    }

    /* 泡泡與粒子：Modal 時只保留粒子（捕獲噴發 / 按鈕發光），不繪背景泡泡 */
    if (modal) {
      Particles.draw();
    } else {
      Bubbles.draw();
      Particles.draw();
    }

    /* 還原相機震動 */
    if (this.camShake > 0) ctx.restore();

    /* 聲納效果 */
    if (this.state === 'play' && this.sonarTimer < 1 && this.upgrade('sonar') > 0) {
      const p = 1 - this.sonarTimer;
      ctx.strokeStyle = 'rgba(126,240,255,' + ((1 - p) * 0.7).toFixed(2) + ')';
      ctx.lineWidth = 2;
      for (const c of this.creatures) {
        const r = p * 60;
        ctx.beginPath(); ctx.arc(c.x, c.y, Math.max(2, r), 0, 7); ctx.stroke();
      }
    }

    this.drawOverlays();

    /* HUD 與各狀態畫面 */
    switch (this.state) {
      case 'menu': this.drawMenu(); break;
      case 'settings': this.drawSettings(); break;
      case 'help': this.drawHelp(); break;
      case 'brief': this.drawBrief(); break;
      case 'play': this.drawHUD(); this.drawControls(); break;
      case 'card': this.drawCard(); break;
      case 'choice': this.drawChoice(); break;
      case 'clear': this.drawClear(); break;
      case 'shop': this.drawShop(); break;
      case 'encyclopedia': this.drawEncyclopedia(); break;
      case 'end': this.drawEnd(); break;
      case 'paused': this.drawPauseMenu(); break;
      case 'test': this.drawTestMode(); break;
    }
    /* 測試模式：遊玩中顯示測試工具列 + Debug Panel */
    if (this.state === 'play' && this.test.active) {
      this.drawTestTools();
      if (this.test.debug) this.drawDebugPanel();
    }
